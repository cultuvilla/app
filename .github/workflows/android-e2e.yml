# Native Android E2E — the release gate that drives the REAL app on a REAL
# Android emulator, against real Firebase emulators, through real user journeys.
#
# It is the only end-to-end suite: the web build (and its Playwright suite) went
# away when the web became a server-rendered read site
# (docs/decisions/web-is-a-read-site.md).
#
# GATED TO THE RELEASE PATHS: a full Gradle build plus an AVD boot
# is far too slow for day-to-day `develop` PRs, and beta is the release
# candidate — the last point where a native-only regression can be caught before
# it becomes a store binary. `develop` PRs keep the fast mobile-ci job.
#
# NIGHTLY ON DEVELOP: a scheduled run drives the suite against `develop` once a
# day, so a native regression surfaces the morning after it merged instead of at
# the next promotion, when it is mixed in with a whole release's worth of change.
# `develop` is the default branch, which is the branch `schedule:` runs on.
name: android-e2e

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  # So a native regression can be chased on a develop branch without waiting for
  # a promotion PR. `flows` narrows it to a few flows (`pnpm e2e:ci:android`).
  workflow_dispatch:
    inputs:
      flows:
        description: >-
          Only these flows, comma-separated (e.g. `20,21` or
          `20-registration-signup`). Empty = the whole suite.
        required: false
        default: ''
  # 03:00 UTC: after the day's merges, before the working day in Spain.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

# The nightly gets its own group and is never cancelled: a manual dispatch on
# develop shares its ref, and under the per-ref group it would silently kill the
# one scheduled run of the day.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'schedule'
        && github.ref != 'refs/heads/beta'
        && github.ref != 'refs/heads/main' }}

jobs:
  android-e2e:
    name: Android E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Four machines, as ios-e2e: one ran the whole suite serially for ~2.5 h
    # and a runner lost two hours in took every result with it. Each shard runs
    # whole tens-groups (shardFlows in scripts/lib/maestro-suite.mjs) against
    # its own AVD, emulators and seed: Gradle build (~15 min, cached) + boot +
    # ~25-50 min of flows. Generous on purpose: timing out mid-suite tells you
    # nothing. Free on a public repo (decided 2026-10-10, user).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SHARD: ${{ matrix.shard }}/4
      # Empty on every event but a dispatch that names flows.
      E2E_NATIVE_FLOW: ${{ inputs.flows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A dispatched selection (`flows=60`) lands on one shard; the others stop
      # here instead of building an APK and booting an AVD for nothing.
      - name: Plan this shard
        id: plan
        run: |
          count=$(node --input-type=module -e "
            import { planFlows } from './scripts/lib/maestro-suite.mjs';
            console.log(planFlows({ label: 'android-e2e', quarantined: new Map(), flow: process.env.E2E_NATIVE_FLOW }).flows.length);
          " | tail -n1)
          echo "run=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The AVD needs hardware acceleration to be usable. ubuntu-latest runners
      # expose /dev/kvm but not to the runner user; this udev rule is the
      # documented fix and must run before the emulator action.
      # The udev dance is BEST EFFORT; only the final check is a real gate.
      # `sudo udevadm control --reload-rules` exits 1 on some runners, and under
      # `bash -e` that killed the whole job — three times in one evening — even
      # though /dev/kvm was already world-writable and the emulator would have
      # booted fine. What actually matters is the last block: if /dev/kvm is not
      # writable the AVD cannot start, and that still fails the job.
      #
      # The gate POLLS rather than sampling once. `udevadm trigger` queues the
      # event and returns; the mode change lands asynchronously, so an immediate
      # `test -w` races it and fails on a runner that would have been ready a
      # moment later. That is not hypothetical — it killed a promotion's E2E in
      # 6s, before a single dependency was installed, on a commit whose suite
      # passed in full on the next runner. `udevadm settle` alone is not enough
      # (it waits for the queue, not for the static_node rule to be applied),
      # hence the bounded retry.
      - name: Enable KVM
        if: steps.plan.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || echo "udevadm reload failed; continuing"
          sudo udevadm trigger --name-match=kvm || echo "udevadm trigger failed; continuing"
          sudo udevadm settle --timeout=10 || echo "udevadm settle failed; continuing"

          for attempt in $(seq 1 10); do
            if [ -w /dev/kvm ]; then
              echo "KVM writable (after ${attempt} attempt(s))"
              exit 0
            fi
            sleep 1
          done

          echo "::error::/dev/kvm is not writable after 10s — this runner cannot" \
            "start an accelerated AVD, so the Maestro suite would never boot." \
            "This is a runner-level condition, not a change in this commit:" \
            "re-run the job to land on a different runner. Diagnostics follow."
          ls -l /dev/kvm || echo "/dev/kvm does not exist at all"
          id
          exit 1

      - name: Setup pnpm
        if: steps.plan.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # 21 for both halves of this job: the Firebase emulators want it (see
      # ci.yml) and AGP 8.x on Expo SDK 56 supports it. One JAVA_HOME, no
      # switching mid-job.
      - name: Setup Java
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: steps.plan.outputs.run == 'true'
        uses: android-actions/setup-android@v3
        # The action's default also installs the legacy `tools` package, which the
        # runner image's cmdline-tools 16.0 no longer carries: sdkmanager exits 1
        # and every run died here from 2026-09-14 on, before a single flow ran.
        with:
          packages: platform-tools

      - name: Install workspace dependencies
        if: steps.plan.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        if: steps.plan.outputs.run == 'true'
        run: npm ci
        working-directory: functions

      - name: Build shared package
        if: steps.plan.outputs.run == 'true'
        run: pnpm shared:build

      - name: Build functions
        if: steps.plan.outputs.run == 'true'
        run: pnpm functions:build

      # Gradle's own cache. The Android build is the long pole in this job by a
      # wide margin, and it is almost entirely dependency resolution + AGP work
      # that does not change between runs.
      - name: Cache Gradle
        if: steps.plan.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-android-e2e-${{ runner.os }}-

      # Prebuild + assembleRelease with USE_FIREBASE_EMULATOR=1 and the AVD host
      # alias baked in. Every non-obvious constraint lives in the script, so the
      # local run and this one produce the same APK.
      - name: Build E2E APK (emulator mode)
        if: steps.plan.outputs.run == 'true'
        run: node scripts/build-android-e2e-apk.mjs

      # Pinned: the installer otherwise fetches the latest release on every run,
      # so a Maestro release alone could turn the suite red with no change here.
      # Version drift has bitten before: 2.4 rejects non-ASCII `inputText`, which
      # flow 70 types ("Peña…"). Bump deliberately and run the suite on the branch.
      - name: Install Maestro
        if: steps.plan.outputs.run == 'true'
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # The installer silently falls back to latest if it ignores the
          # variable, so prove the pin took instead of trusting it.
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -n1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed installed, but $MAESTRO_VERSION is pinned."
            exit 1
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # One boot of everything: the action brings up the AVD, then the script
      # inside it boots the Firebase emulators, seeds the deterministic E2E
      # fixtures and runs the Maestro suite — the exact command a developer runs
      # locally (`pnpm test:e2e:android`).
      #
      # API 33 + google_apis + x86_64 matches the image the repo's local AVD
      # uses. `-no-snapshot-save` keeps a forced kill from poisoning the image.
      - name: Seed + run the Maestro suite on an AVD
        if: steps.plan.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_ANDROID_APK: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          E2E_FIREBASE_PROJECT: cultuvilla-test
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          # Animations make every `tapOn` race the transition it triggered.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          script: pnpm test:e2e:android

      - name: Upload Maestro artifacts
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-android-shard-${{ matrix.shard }}
          path: |
            apps/mobile/e2e/native/report/
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7
