name: Deploy Firebase (reusable)

# Backend + hosting deploy for one environment. Called by deploy-dev/beta/prod.
# Auth is keyless via Workload Identity Federation — the caller's GitHub
# Environment supplies GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT and the Firebase
# web config as environment variables. No service-account keys are stored.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (dev | beta | production)
        required: true
        type: string
      firebase_alias:
        description: .firebaserc project alias (dev | beta | prod)
        required: true
        type: string
      ref:
        description: Commit to deploy (blank = the triggering commit). Set by a held-backend deploy.
        required: false
        type: string
        default: ""
      held_backend:
        description: >-
          This run deploys a backend an earlier prod deploy held back
          (release-publish.yml, or announce-when-live.yml once both stores
          serve the release). Deploys everything and records nothing.
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.firebase_alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Never cancel an in-flight deploy — a half-applied prod deploy is worse
    # than a queued one.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      # Prod and beta need history: the release record rolls up
      # `Breaking-Client:` trailers — since the previous release tag on prod,
      # across the merge's own commits on beta.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.firebase_alias == 'dev' && '1' || '0' }}

      # An explicit `ref` arrives from a workflow_dispatch input, and
      # actions/checkout will fetch ANY commit the remote has — an unmerged
      # branch included. The environment's branch rule guards the workflow ref,
      # not this one, so without this check a dispatch could ship unreviewed
      # functions and rules. Only code already on main may deploy.
      - name: Refuse a ref that is not on main
        if: ${{ inputs.ref != '' }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::${REF} is not an ancestor of main — refusing to deploy it."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # firebase deploy --only functions runs a predeploy that rebuilds these,
      # but building up front fails fast on a type error before we touch GCP.
      - name: Build shared + functions
        run: |
          pnpm shared:build
          pnpm functions:build

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Release plan — prod only, and not on the run that deploys a held
      # backend. A breaking release (a `Breaking-Client:` trailer since the
      # previous release tag, or a still-held earlier one) ships only its
      # indexes here: no backfills, no gates, no rules, no functions, no
      # hosting. Its binaries go to the stores, which hold them after approval
      # (iOS manual release, Play managed publishing); once both approve,
      # `pnpm release:publish` (release-publish.yml) runs this workflow with
      # `held_backend` — backfills, gates, rules, functions, hosting — and
      # releases iOS while the user publishes on Play. So nothing of a breaking
      # release reaches users until a person releases it everywhere at once.
      # Hosting is held with the functions it rewrites to: shipping it alone
      # took cultuvilla.es down on 1.7.1. `[auto-deploy]` in the merge commit
      # overrides the hold. Beta and dev never hold.
      # See docs/decisions/announce-when-live-poller.md.
      - name: Release plan — hold a breaking release until a person releases it
        id: release
        if: ${{ inputs.firebase_alias == 'prod' && !inputs.held_backend }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/release-announce.mjs plan --env=prod

      # Auto-apply opted-in backfills — beta/prod only. Runs every backfill
      # that opted into `autoApply` for this env and has no marker yet, in
      # dependency order (`dependsOn`). `validateMeta` only accepts that opt-in
      # on an idempotent backfill, so this is safe to run on every deploy; with
      # nothing opted in it is a no-op that prints one line.
      #
      # RUNS FIRST, BEFORE BOTH GATES. It writes the very data the conformance
      # gate reads, so sitting after that gate made it unreachable: the gate
      # failed on exactly the docs auto-apply was about to fix, and the deploy
      # died before reaching it. A migration that can apply itself must do so
      # before anything inspects the data. Order is locked by backfillGate.test.ts.
      - name: Auto-apply opted-in backfills
        if: ${{ inputs.firebase_alias != 'dev' && steps.release.outputs.hold_backend != 'true' }}
        run: node scripts/backfills-cli.mjs auto-apply --env ${{ inputs.firebase_alias }} --confirm --apply

      # Data-conformance gate — beta/prod only. Before shipping any schema
      # change, walk the TARGET env's live Firestore docs through the Zod
      # converters in THIS build (the exact `schema.parse` the app runs on
      # read). A required field added without a backfill makes the strict
      # converter throw on read and crashes every screen that reads that
      # collection; this fails the deploy BEFORE anything ships instead of
      # letting the crash reach users. Runs before the first `firebase deploy`
      # so a nonconforming env blocks the whole pipeline (rules + functions +
      # hosting). Dev is exempt (transient drift there is caught manually via
      # `pnpm check:dev-conformance`). The script reads via the WIF service
      # account through GOOGLE_APPLICATION_CREDENTIALS — the SA needs Firestore
      # read (roles/datastore.viewer or broader).
      - name: Conformance gate — live data matches shipped schema
        if: ${{ inputs.firebase_alias != 'dev' && steps.release.outputs.hold_backend != 'true' }}
        run: node scripts/check-dev-conformance.mjs --env ${{ inputs.firebase_alias }}

      # Backfill gate — beta/prod only. A code change deploys automatically
      # when it reaches an env; the data migration it depends on does NOT. This
      # fails the deploy when a `pre-deploy` backfill has no completion marker
      # for the target env — i.e. we are about to ship converters that cannot
      # read this env's data. It is the machine-checkable version of the
      # CHANGELOG `**Migration:**` marker, which was a human convention with no
      # enforcement. `post-deploy` backfills are reported as a warning instead:
      # blocking on them would deadlock, since they cannot run until the deploy
      # they would be blocking has happened.
      #
      # Unblock a failure by running the named backfill against this env —
      # Actions → "Run Backfill" (run-backfill.yml), which needs no local
      # credentials. Skipped for dev for the same reason as the conformance
      # gate above.
      - name: Backfill gate — required migrations have run on the target env
        if: ${{ inputs.firebase_alias != 'dev' && steps.release.outputs.hold_backend != 'true' }}
        run: node scripts/backfills-cli.mjs verify --env ${{ inputs.firebase_alias }}

      # Custom-token signing gate — all envs. createCustomToken() signs via the
      # IAM Credentials API as the functions runtime SA, which therefore needs
      # `iam.serviceAccounts.signBlob` on ITSELF. The Firebase CLI does not grant
      # that at deploy time, and the Auth emulator stubs signing entirely — so a
      # project missing the binding passes every test, deploys clean, and then
      # 500s on every custom-token sign-in at runtime (this is how email-code
      # sign-in shipped broken to prod). Runs before the first `firebase deploy`
      # so a misconfigured project blocks the pipeline instead of shipping a
      # broken auth path. Read-only; needs roles/iam.serviceAccountViewer on the
      # WIF SA (granted by scripts/setup-ci-deploy-wif.sh).
      - name: Signing gate — runtime SA can mint custom tokens
        run: node scripts/check-custom-token-signing.mjs --env ${{ inputs.firebase_alias }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      # app.config.ts reads FIREBASE_*_<SUFFIX> where SUFFIX matches APP_ENV.
      # The environment stores the config under generic names; map them to the
      # suffixed names the Expo web export expects.
      - name: Export Firebase web config for the active env
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          FB_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FB_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          S=$(echo "$APP_ENV" | tr '[:lower:]' '[:upper:]')
          {
            echo "APP_ENV=$APP_ENV"
            echo "FIREBASE_API_KEY_${S}=$FB_API_KEY"
            echo "FIREBASE_AUTH_DOMAIN_${S}=$FB_AUTH_DOMAIN"
            echo "FIREBASE_PROJECT_ID_${S}=$FB_PROJECT_ID"
            echo "FIREBASE_STORAGE_BUCKET_${S}=$FB_STORAGE_BUCKET"
            echo "FIREBASE_MESSAGING_SENDER_ID_${S}=$FB_SENDER_ID"
            echo "FIREBASE_APP_ID_${S}=$FB_APP_ID"
            echo "GOOGLE_WEB_CLIENT_ID_${S}=$GOOGLE_WEB_CLIENT_ID"
          } >> "$GITHUB_ENV"

      # Backend first, so schema/permissions land before code that relies on
      # them and before hosting rewrites resolve the readSite function.
      - name: Deploy Firestore & Storage rules
        if: ${{ steps.release.outputs.hold_backend != 'true' }}
        run: firebase deploy --only firestore:rules,storage --project ${{ inputs.firebase_alias }} --non-interactive

      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project ${{ inputs.firebase_alias }} --non-interactive

      # production-release.yml reads this step's conclusion: `skipped` means the
      # backend is held, and it then holds the production OTA too. Rename both.
      - name: Deploy Cloud Functions
        if: ${{ steps.release.outputs.hold_backend != 'true' }}
        run: firebase deploy --only functions --project ${{ inputs.firebase_alias }} --non-interactive --force

      # Belt-and-suspenders (fixture-login security model, Option 1C): a deployed
      # bundle must NEVER be built with the E2E emulator bypass enabled. The flag
      # is never set in this workflow; assert that positively so a future edit
      # that leaks it fails the deploy instead of shipping the auth bypass.
      - name: Assert E2E emulator bypass is disabled
        run: |
          if [ -n "${USE_FIREBASE_EMULATOR:-}" ] && [ "${USE_FIREBASE_EMULATOR}" != "0" ]; then
            echo "::error::USE_FIREBASE_EMULATOR is set ('${USE_FIREBASE_EMULATOR}') during a deploy build — refusing to ship the E2E auth bypass."
            exit 1
          fi
          echo "OK — USE_FIREBASE_EMULATOR is unset; deployed bundle excludes the E2E bypass."

      # Hosting serves only static files — brand images, this env's deep-link
      # identities and robots.txt — and rewrites every page to the `readSite`
      # function deployed above (docs/decisions/web-is-a-read-site.md).
      - name: Assemble static web files
        if: ${{ steps.release.outputs.hold_backend != 'true' }}
        run: node scripts/build-web-static.mjs ${{ inputs.firebase_alias }}

      # `hosting:app` and not `hosting` — the internal founders' panel is a second
      # hosting target that exists on dev only. A bare `--only hosting` would try
      # to deploy it from every env, and a missing panel build would block the
      # app's promotion. See hostingTargets.test.ts.
      - name: Deploy Hosting
        if: ${{ steps.release.outputs.hold_backend != 'true' }}
        run: firebase deploy --only hosting:app --project ${{ inputs.firebase_alias }} --non-interactive

      # The read site must answer after every deploy, held or not. Before the
      # release is recorded, so a broken site never reaches store review.
      # 2026-10-07: a held release took cultuvilla.es down for five hours with
      # every deploy step green, and Google Play rejected the release over it.
      - name: Smoke-check the live read site
        run: node scripts/smoke-read-site.mjs --env=${{ inputs.firebase_alias }}

      # Hand the release to the announce poller (prod and beta). After hosting,
      # so a release whose deploy failed is never recorded. Prod records the
      # hold the plan step decided, which is what this run actually did; beta
      # never holds, and its poller announces the Cultuvilla Beta Android app.
      - name: Record the release for the announce poller
        if: ${{ (inputs.firebase_alias == 'prod' || inputs.firebase_alias == 'beta') && !inputs.held_backend }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/release-announce.mjs record --env=${{ inputs.firebase_alias }} --hold=${{ steps.release.outputs.hold_backend || 'false' }}

      # A held backend just shipped — tell the poller only now, on success. If
      # any step above failed, the pending doc stays: re-run release-publish,
      # or the poller dispatches this deploy once both stores serve the release.
      - name: Finish the held release
        if: ${{ inputs.firebase_alias == 'prod' && inputs.held_backend }}
        run: node scripts/release-announce.mjs finish --env=prod --sha="$(git rev-parse HEAD)"

      # Keeps `config/appVersion` well-formed on every env (store URLs, both
      # platforms present) WITHOUT moving anything a client reacts to. Both
      # omitted flags preserve what is stored: `latest` is written only by the
      # announce poller once a store serves the release, and `minSupported` only
      # by the poller (a breaking release, once live) or a deliberate "Set App
      # Version" dispatch. A deploy announcing its own version is what told
      # every iOS user on 1.2.2 to update to a 1.3.0 no store had.
      - name: Refresh config/appVersion, preserving latest and the wall
        run: node scripts/seed-app-version-config.mjs --env=${{ inputs.firebase_alias }} --confirm
