name: beta-build-and-submit

# Merging to `beta` builds the Android BETA APP (`com.cultuvilla.app.beta`, its
# own Play listing, pointed at `cultuvilla-beta`) and submits it to that app's
# internal track, and separately builds the iOS release and puts it in front of
# every TestFlight group — internal testers at once, external testers once Beta
# App Review passes (this job submits that review). Mirrors ordago-apps'
# beta-build-and-submit.yml.
#
# Android beta is its own app so it installs NEXT TO the store app: a tester
# keeps the public Cultuvilla and adds "Cultuvilla Beta", instead of Play
# silently swapping their store install for a testing build. The internal track
# needs no review. iOS cannot do the same — TestFlight and the App Store share
# one install per bundle id — so iOS keeps building the production profile.
# See docs/decisions/beta-is-its-own-play-app.md.
#
# The Play side can be frozen on its own: set the repo variable
# PLAY_SUBMIT_PAUSED=true. Disabling the whole workflow for that — as was done
# on 2026-09-14 — silently froze iOS too.
#
# Deliberately NOT scoped to a GitHub `environment`: the `Production`
# environment's branch policy allows only `main`, so a beta-triggered job that
# named it would be rejected outright. Repo-level secrets are read directly.
#
# Locked by packages/shared/test/ci/storeRelease.test.ts.

on:
  push:
    branches: [beta]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: beta-build-and-submit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android beta app build + submit -> internal
    if: ${{ vars.PLAY_SUBMIT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Fail loudly and early rather than 40 minutes into a build that cannot be
      # submitted. Until the Play service account exists this is where the
      # workflow stops, and the message says exactly what to do about it.
      - name: Require store credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not set."
            missing=1
          fi
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set — see docs/plans/ongoing/store-release.md (Play Console -> Setup -> API access -> Release Manager)."
            missing=1
          fi
          [ "$missing" = "0" ]

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle imports @cultuvilla/shared from dist/, so it has to exist
      # before Metro resolves it — same reason the deploy workflows build it.
      - name: Build shared package
        run: pnpm shared:build

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json's submit profiles point at this path. The key never lands in
      # the repo — only in the runner workspace, for the life of the job.
      - name: Materialize the Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > apps/mobile/google-play-service-account.json

      - name: Build and submit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile beta \
            --platform android \
            --non-interactive \
            --wait \
            --auto-submit-with-profile beta

      - name: Remove the key
        if: always()
        run: rm -f apps/mobile/google-play-service-account.json

  ios:
    name: iOS build + submit -> TestFlight (internal + external)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Fail loudly and early rather than 40 minutes into a build that cannot be
      # submitted. See mobile-release.yml for the same check on the manual path.
      - name: Require store credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          missing=()
          [ -z "${EXPO_TOKEN}" ] && missing+=("EXPO_TOKEN")
          [ -z "${APPLE_ASC_API_KEY_P8}" ] && missing+=("APPLE_ASC_API_KEY_P8")
          [ -z "${APPLE_ASC_KEY_ID}" ] && missing+=("APPLE_ASC_KEY_ID")
          [ -z "${APPLE_ASC_ISSUER_ID}" ] && missing+=("APPLE_ASC_ISSUER_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secret/variable(s): ${missing[*]} — see docs/plans/ongoing/store-release.md."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --json pins the exact build this run made. Asking EAS afterwards for "the
      # latest finished build" could pick up a concurrent manual build instead,
      # and hand testers (or App Review) a binary this run never produced.
      - name: Build iOS archive
        id: ios_build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --profile production --platform ios --non-interactive --wait --json > ios-build.json
          node -e '
            const [b] = JSON.parse(require("fs").readFileSync("ios-build.json", "utf8"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `id=${b.id}\nbuild_number=${b.appBuildVersion}\n`);
          '

      # After the build, never before: eas.json is a fingerprint source, and
      # `eas build` uploads the project as it stands. Patching the ASC ids in
      # first gave every store binary a runtime version no clean checkout of
      # its commit reproduces, so no OTA update could ever reach it.
      # ascApiKeyPath points at the .p8 (relative to apps/mobile), gitignored
      # and never persisted; ascApiKeyId/ascApiKeyIssuerId only identify the
      # key and live in repo vars rather than in the committed eas.json.
      - name: Write App Store Connect API key
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          printf '%s' "${APPLE_ASC_API_KEY_P8}" > apps/mobile/apple-asc-api-key.p8
          node -e "
            const fs = require('fs');
            const path = 'apps/mobile/eas.json';
            const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
            eas.submit.production.ios.ascApiKeyId = process.env.APPLE_ASC_KEY_ID;
            eas.submit.production.ios.ascApiKeyIssuerId = process.env.APPLE_ASC_ISSUER_ID;
            fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');
          "

      - name: Submit to App Store Connect
        working-directory: apps/mobile
        run: |
          eas submit \
            --profile production \
            --platform ios \
            --id "${{ steps.ios_build.outputs.id }}" \
            --non-interactive

      # eas submit adds the upload to no group. Internal groups on automatic
      # distribution pick it up anyway; external ones need it added and a Beta
      # App Review, with the version's store notes as "What to Test".
      - name: Distribute to TestFlight testers
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          BUILD_NUMBER="${{ steps.ios_build.outputs.build_number }}"
          node scripts/appstore-release.mjs testflight --build-number="${BUILD_NUMBER}" --groups=all --beta-review --apply

      - name: Remove the key
        if: always()
        run: rm -f apps/mobile/apple-asc-api-key.p8
