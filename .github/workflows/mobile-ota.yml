name: mobile-ota

# Publishes the JS bundle to an EAS Update channel, so a fix reaches apps that
# are ALREADY INSTALLED instead of waiting for a store binary.
#
# Why this exists: `DetailInfoCard`'s `h-full` broke every entity detail screen
# on native only. The fix merged the same day, but the newest binary in anyone's
# hands was 0.19.0 from four days earlier, there was no OTA channel, and
# `mobile-release` could not submit (no Play service account). A one-line JS fix
# had no route to a user. This is that route.
#
# Two automatic routes, one publish step:
#   - push to `beta`  -> channel `beta` (this file's own trigger);
#   - push to `main`  -> channel `production`, via workflow_call from
#     production-release.yml, which runs it only after the prod backend deploy
#     is green and only when the push carries more than docs/workflow edits.
# Production went automatic on 2026-10-06: the human gate is merging the
# `beta -> main` promotion PR, not a second dispatch afterwards. See
# docs/decisions/production-auto-release.md. workflow_dispatch stays for
# publishing to any channel by hand.
#
# An update reaches a binary only when their fingerprints match. That survives a
# release's `version` bump because apps/mobile/fingerprint.config.js skips
# ExpoConfigVersions, and because no workflow edits the fingerprinted eas.json
# before `eas build` uploads the project. Binaries built before that config
# landed carry the old fingerprint and never receive these updates.
#
# LIMIT: OTA carries JS and assets, never native code. Adding a config plugin or
# a native module changes the fingerprint, and EAS then refuses to serve that
# update to older binaries — correctly, since they cannot run it. Those still
# need `mobile-release`. See the `expo-native-rebuild` skill.

on:
  push:
    branches: [beta]
    # Skip runs that cannot change the bundle. Docs and workflow edits are the
    # common case and a no-op update just adds noise to the channel history.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish to
        type: choice
        options: [beta, dev, production]
        default: beta
  workflow_call:
    inputs:
      channel:
        description: Channel to publish to (beta | dev | production)
        type: string
        required: true
    secrets:
      EXPO_TOKEN:
        required: true

concurrency:
  group: mobile-ota-${{ inputs.channel || 'beta' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish OTA -> ${{ inputs.channel || 'beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle imports @cultuvilla/shared from dist/, so it has to be built
      # before Metro resolves it — same reason the deploy workflows build it.
      - name: Build shared package
        run: pnpm shared:build

      - name: Fail early if EXPO_TOKEN is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not set — cannot publish an update."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ inputs.channel == 'production' && 'prod' || (inputs.channel || 'beta') }}
        # An update carries its own app config, `extra.firebaseConfig` included,
        # and replaces the one the binary was built with. Without --environment
        # the EAS variables are never loaded and every update ships EMPTY
        # Firebase and Google Sign-In config — invisible while no store build
        # listened on `beta`, fatal the moment one does (and on any production
        # dispatch). Same mapping as eas.json: production -> production, else preview.
        run: |
          eas update \
            --branch "${{ inputs.channel || 'beta' }}" \
            --environment "${{ inputs.channel == 'production' && 'production' || 'preview' }}" \
            --message "${GITHUB_SHA::7}" \
            --non-interactive
