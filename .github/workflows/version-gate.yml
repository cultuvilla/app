name: Version gate (beta)

# Release-PR gates (AGENTS.md -> Versioning & releases). Runs ONLY on PRs whose
# base is beta or main, so ordinary develop PRs are untouched.
#   version-bump    beta: app.config.ts `version` strictly greater than beta's.
#   release-source  beta <- release/<that version>; main <- beta; a release PR
#                   is titled with the bare version (`pnpm release:cut` does all
#                   three). Re-runs on `edited` so fixing the title clears it.
on:
  pull_request:
    branches: [beta, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  version-bump:
    if: github.base_ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch beta
        run: git fetch origin beta --depth=1
      - name: Materialize beta's app.config.ts
        run: git show origin/beta:apps/mobile/app.config.ts > "$RUNNER_TEMP/beta.app.config.ts"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # This job installs no deps (it runs a dependency-free node script), so
          # skip setup-node@v5's default package-manager cache — it auto-detects
          # the pnpm `packageManager` field and fails with "Unable to locate
          # executable file: pnpm" since pnpm isn't set up in this job.
          package-manager-cache: false
      - name: Require a version bump
        run: node scripts/check-beta-version-bump.mjs apps/mobile/app.config.ts "$RUNNER_TEMP/beta.app.config.ts"

  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Materialize the base's app.config.ts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/$BASE_REF:apps/mobile/app.config.ts" > "$RUNNER_TEMP/base.app.config.ts"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the source branch and title
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/check-release-pr.mjs \
            --base="$BASE_REF" --head-ref="$HEAD_REF" --title="$PR_TITLE" \
            --head-config=apps/mobile/app.config.ts --base-config="$RUNNER_TEMP/base.app.config.ts"
