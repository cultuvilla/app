# Native iOS E2E — the same Maestro suite as android-e2e.yml, driving the REAL
# app on an iOS Simulator, against real Firebase emulators, through the same
# real user journeys. The flows are shared; only the build and the device
# differ (scripts/build-ios-e2e-app.mjs, scripts/run-ios-e2e.mjs).
#
# The Simulator needs macOS. This repo is public, so GitHub's standard macOS
# runners cost nothing — the price is wall-clock, not money.
#
# GATED LIKE ANDROID: the release paths (beta/main), plus manual dispatch. A
# develop PR never runs it — merging to develop does not wait on a ~90-minute
# macOS suite. Harness work on a develop branch dispatches it by hand
# (`pnpm e2e:ci:ios`), since macOS is the only place it can run at all.
name: ios-e2e

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  # `flows` narrows a manual run to a few flows (`pnpm e2e:ci:ios`).
  workflow_dispatch:
    inputs:
      flows:
        description: >-
          Only these flows, comma-separated (e.g. `20,21` or
          `20-registration-signup`). Empty = the whole suite.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/beta' && github.ref != 'refs/heads/main' }}

jobs:
  # Builds the Simulator app ONCE; the shards below share it. The build is the
  # long pole (~35 min) and identical for every shard, so building per shard
  # would multiply the slowest step by the number of machines.
  build:
    name: Build iOS E2E app
    # Expo SDK 56 needs Xcode 26.4+, which the macOS 26 image carries.
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      # Downloaded pod sources only: `ios/` itself is regenerated by
      # `expo prebuild --clean` on every run.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-ios-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: pods-ios-e2e-${{ runner.os }}-

      # Prebuild + a Release Simulator build with USE_FIREBASE_EMULATOR=1.
      # Every non-obvious constraint lives in the script, so the local run and
      # this one produce the same app. Its last line is the .app path. Tarred
      # because upload-artifact drops the bundle's symlinks and exec bits.
      - name: Build E2E app (emulator mode)
        run: |
          node scripts/build-ios-e2e-app.mjs | tee "$RUNNER_TEMP/ios-build.log"
          app="$(tail -n 1 "$RUNNER_TEMP/ios-build.log")"
          tar -czf "$RUNNER_TEMP/ios-e2e-app.tgz" -C "$(dirname "$app")" "$(basename "$app")"

      - name: Upload E2E app
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-app
          path: ${{ runner.temp }}/ios-e2e-app.tgz
          retention-days: 1

  # The suite, split across machines by scripts/lib/maestro-suite.mjs
  # (shardFlows): each shard runs whole tens-groups of flows against its own
  # emulators and seed, so in-group order (20 → 22) still holds. One machine
  # ran 22 flows in ~70 min (Maestro restarts its iOS driver per flow); four
  # bring the whole workflow to roughly build + 35 min. Free on a public repo.
  suite:
    name: iOS E2E shard ${{ matrix.shard }}/4
    needs: build
    runs-on: macos-26
    # ~15 min of setup (emulators, seed, deep-link trust) + a tens-group pair of
    # deep flows, ~45-60 min, plus a retry or two. Generous on purpose, as for
    # Android: timing out mid-suite tells you nothing (75 cut off two shards).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Job-level, not just on the suite step: the boot step reads them too, so a
    # shard a dispatched selection leaves empty skips its cold boot.
    env:
      # Seconds the Functions emulator gives a new function worker to boot. The
      # 30 s default lapsed on a 3-core runner that also hosts the Simulator:
      # firebase-tools logged "Failed to load function." and the app's callable
      # came back as "No hemos podido contactar con el servidor" (flows 11, 72).
      FUNCTIONS_DISCOVERY_TIMEOUT: '120'
      E2E_SHARD: ${{ matrix.shard }}/4
      # Empty on every event but a dispatch that names flows.
      E2E_NATIVE_FLOW: ${{ inputs.flows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The Firebase emulators and Maestro both run on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build shared package
        run: pnpm shared:build

      - name: Build functions
        run: pnpm functions:build

      # Spotlight indexes whatever the job writes (node_modules, Maestro's
      # artifacts) and burst to 80% CPU and ~500 MB beside Firestore SDK ping
      # timeouts on this 3-core, 7 GB runner. Nothing in the job searches.
      - name: Turn off Spotlight indexing
        run: sudo mdutil -a -i off || true

      # Boot to completion before the emulators and Maestro start, never
      # overlapping them: a cold boot pins the 3-core runner for minutes, and
      # overlapping the suite's start timed Maestro's driver out. See
      # --boot-only in scripts/run-ios-e2e.mjs.
      - name: Boot the Simulator
        run: node scripts/run-ios-e2e.mjs --boot-only

      - name: Download E2E app
        uses: actions/download-artifact@v4
        with:
          name: ios-e2e-app
          path: ${{ runner.temp }}

      - name: Unpack E2E app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/ios-e2e-app.tgz" -C "$RUNNER_TEMP/app"
          echo "E2E_IOS_APP=$(ls -d "$RUNNER_TEMP"/app/*.app)" >> "$GITHUB_ENV"

      # Same pin as android-e2e.yml: both platforms run one suite on one Maestro.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # The installer silently falls back to latest if it ignores the
          # variable, so prove the pin took instead of trusting it.
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -n1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed installed, but $MAESTRO_VERSION is pinned."
            exit 1
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Samples load, swap, the busiest processes and the largest every 10 s
      # for the rest of the job (a background process outlives its step), so a
      # Firestore SDK "ping timeout" (scripts/run-ios-e2e.mjs counts them) can
      # be read against what the runner was doing at that moment.
      - name: Sample runner load
        run: |
          mkdir -p apps/mobile/e2e/native/report
          (while sleep 10; do
            echo "== $(date -u +%H:%M:%S) load $(sysctl -n vm.loadavg) swap $(sysctl -n vm.swapusage)"
            vm_stat | grep -E 'Pageouts|Swapins|Swapouts' | tr -s ' ' | paste -sd ' ' -
            ps -Ao pid,pcpu,rss,nice,ucomm -r | head -n 10
            echo "-- largest"
            ps -Ao pid,pcpu,rss,nice,ucomm -m | sed 1d | head -n 5
          done) > apps/mobile/e2e/native/report/runner-cpu.log 2>&1 &

      # The exact command a developer runs locally on a Mac: boots the Firebase
      # emulators, seeds the deterministic E2E fixtures, then the runner installs
      # E2E_IOS_APP and runs this shard's flows.
      - name: Seed + run the Maestro suite on a Simulator
        env:
          E2E_FIREBASE_PROJECT: cultuvilla-test
          # Production's gRPC keepalive policy for the Firestore emulator. The
          # stock jar dropped the SDK's connections for pinging every 30 s
          # (GOAWAY too_many_pings), stalling writes ~90 s on the Simulator.
          # The runner checks the policy took before seeding, and fails the
          # shard if the SDK logs a ping timeout or too_many_pings anyway.
          # docs/decisions/ios-e2e-emulator-keepalive.md
          EMULATOR_KEEPALIVE: production
          # The emulators' JVMs only (scripts/run-tests-with-emulators.mjs): the
          # Firestore emulator and the Storage rules runtime, one GC log each
          # (%p), so a pause long enough to miss a keepalive ping shows. The
          # rules runtime reports the JVM's "Picked up JAVA_TOOL_OPTIONS" line
          # as an "Unexpected rules runtime error" warning; it is harmless.
          EMULATOR_JAVA_TOOL_OPTIONS: >-
            -Xlog:gc:file=${{ github.workspace }}/apps/mobile/e2e/native/report/emulator-gc-%p.log:uptime,time
        run: pnpm test:e2e:ios

      # Why the Simulator ended an app process: runningboardd and SpringBoard
      # log the reason (a crash, a memory limit, a launch watchdog). Maestro's
      # Simulator log keeps only the app's own lines and faults, so it misses it.
      - name: Collect the Simulator's termination reasons
        if: ${{ always() }}
        run: |
          udid="$(xcrun simctl list devices booted -j | jq -r '[.devices[][] | select(.state == "Booted")][0].udid // empty')"
          [ -n "$udid" ] || exit 0
          mkdir -p apps/mobile/e2e/native/report
          xcrun simctl spawn "$udid" log show --last 3h --style compact \
            --predicate 'process == "runningboardd" OR process == "SpringBoard"' 2>/dev/null \
            | grep -iE 'cultuvilla|jetsam|terminat|watchdog|8badf00d|memory' \
            > apps/mobile/e2e/native/report/sim-terminations.log || true
          # DIAG (w18): the app's contact-gate and socio-listener trace.
          xcrun simctl spawn "$udid" log show --last 3h --style compact --info --debug \
            --predicate 'process == "Dev" AND eventMessage CONTAINS "[w18-trace]"' 2>/dev/null \
            > apps/mobile/e2e/native/report/w18-trace.log || true

      # always(), not !cancelled(): a timeout cancels the job, and the
      # screenshots of a run that timed out are exactly the ones needed. The
      # app's crash reports (Dev-*.ips) carry the stack Maestro's "App crashed"
      # points at; without them a crash leaves only its last log line.
      - name: Upload Maestro artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios-shard-${{ matrix.shard }}
          path: |
            apps/mobile/e2e/native/report/
            ~/.maestro/tests/
            firestore-debug.log
            ~/Library/Logs/DiagnosticReports/Dev*
            ~/Library/Logs/DiagnosticReports/JetsamEvent*
          if-no-files-found: ignore
          retention-days: 7
