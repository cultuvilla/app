# Native iOS E2E — the same Maestro suite as android-e2e.yml, driving the REAL
# app on an iOS Simulator, against real Firebase emulators, through the same
# real user journeys. The flows are shared; only the build and the device
# differ (scripts/build-ios-e2e-app.mjs, scripts/run-ios-e2e.mjs).
#
# The Simulator needs macOS. This repo is public, so GitHub's standard macOS
# runners cost nothing — the price is wall-clock, not money.
#
# GATED LIKE ANDROID: the release paths (beta/main), plus manual dispatch. A
# develop PR never runs it — merging to develop does not wait on a ~90-minute
# macOS suite. Harness work on a develop branch dispatches it by hand
# (`pnpm e2e:ci:ios`), since macOS is the only place it can run at all.
name: ios-e2e

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  # `flows` narrows a manual run to a few flows (`pnpm e2e:ci:ios`).
  workflow_dispatch:
    inputs:
      flows:
        description: >-
          Only these flows, comma-separated (e.g. `20,21` or
          `20-registration-signup`). Empty = the whole suite.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/beta' && github.ref != 'refs/heads/main' }}

jobs:
  # Builds the Simulator app ONCE; the shards below share it. The build is the
  # long pole (~35 min) and identical for every shard, so building per shard
  # would multiply the slowest step by the number of machines.
  build:
    name: Build iOS E2E app
    # Expo SDK 56 needs Xcode 26.4+, which the macOS 26 image carries.
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      # Downloaded pod sources only: `ios/` itself is regenerated by
      # `expo prebuild --clean` on every run.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-ios-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: pods-ios-e2e-${{ runner.os }}-

      # Prebuild + a Release Simulator build with USE_FIREBASE_EMULATOR=1.
      # Every non-obvious constraint lives in the script, so the local run and
      # this one produce the same app. Its last line is the .app path. Tarred
      # because upload-artifact drops the bundle's symlinks and exec bits.
      - name: Build E2E app (emulator mode)
        run: |
          node scripts/build-ios-e2e-app.mjs | tee "$RUNNER_TEMP/ios-build.log"
          app="$(tail -n 1 "$RUNNER_TEMP/ios-build.log")"
          tar -czf "$RUNNER_TEMP/ios-e2e-app.tgz" -C "$(dirname "$app")" "$(basename "$app")"

      - name: Upload E2E app
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-app
          path: ${{ runner.temp }}/ios-e2e-app.tgz
          retention-days: 1

  # The suite, split across machines by scripts/lib/maestro-suite.mjs
  # (shardFlows): each shard runs whole tens-groups of flows against its own
  # emulators and seed, so in-group order (20 → 22) still holds. One machine
  # ran 22 flows in ~70 min (Maestro restarts its iOS driver per flow); four
  # bring the whole workflow to roughly build + 35 min. Free on a public repo.
  suite:
    name: iOS E2E shard ${{ matrix.shard }}/4
    needs: build
    runs-on: macos-26
    # ~15 min of setup (emulators, seed, deep-link trust) + a tens-group pair of
    # deep flows, ~45-60 min, plus a retry or two. Generous on purpose, as for
    # Android: timing out mid-suite tells you nothing (75 cut off two shards).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Job-level, not just on the suite step: the boot step reads them too, so a
    # shard a dispatched selection leaves empty skips its cold boot.
    env:
      # Seconds the Functions emulator gives a new function worker to boot. The
      # 30 s default lapsed on a 3-core runner that also hosts the Simulator:
      # firebase-tools logged "Failed to load function." and the app's callable
      # came back as "No hemos podido contactar con el servidor" (flows 11, 72).
      FUNCTIONS_DISCOVERY_TIMEOUT: '120'
      E2E_SHARD: ${{ matrix.shard }}/4
      # Empty on every event but a dispatch that names flows.
      E2E_NATIVE_FLOW: ${{ inputs.flows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The Firebase emulators and Maestro both run on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build shared package
        run: pnpm shared:build

      - name: Build functions
        run: pnpm functions:build

      # Boot to completion before the emulators and Maestro start, never
      # overlapping them: a cold boot pins the 3-core runner for minutes, and
      # overlapping the suite's start timed Maestro's driver out. See
      # --boot-only in scripts/run-ios-e2e.mjs.
      - name: Boot the Simulator
        run: node scripts/run-ios-e2e.mjs --boot-only

      - name: Download E2E app
        uses: actions/download-artifact@v4
        with:
          name: ios-e2e-app
          path: ${{ runner.temp }}

      - name: Unpack E2E app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/ios-e2e-app.tgz" -C "$RUNNER_TEMP/app"
          echo "E2E_IOS_APP=$(ls -d "$RUNNER_TEMP"/app/*.app)" >> "$GITHUB_ENV"

      # Same pin as android-e2e.yml: both platforms run one suite on one Maestro.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # The installer silently falls back to latest if it ignores the
          # variable, so prove the pin took instead of trusting it.
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -n1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed installed, but $MAESTRO_VERSION is pinned."
            exit 1
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The exact command a developer runs locally on a Mac: boots the Firebase
      # emulators, seeds the deterministic E2E fixtures, then the runner installs
      # E2E_IOS_APP and runs this shard's flows.
      - name: Seed + run the Maestro suite on a Simulator
        env:
          E2E_FIREBASE_PROJECT: cultuvilla-test
        run: pnpm test:e2e:ios

      # always(), not !cancelled(): a timeout cancels the job, and the
      # screenshots of a run that timed out are exactly the ones needed.
      - name: Upload Maestro artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios-shard-${{ matrix.shard }}
          path: |
            apps/mobile/e2e/native/report/
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7
