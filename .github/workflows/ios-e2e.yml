# Native iOS E2E — the same Maestro suite as android-e2e.yml, driving the REAL
# app on an iOS Simulator, against real Firebase emulators, through the same
# real user journeys. The flows are shared; only the build and the device
# differ (scripts/build-ios-e2e-app.mjs, scripts/run-ios-e2e.mjs).
#
# The Simulator needs macOS. This repo is public, so GitHub's standard macOS
# runners cost nothing — the price is wall-clock, not money.
#
# GATED LIKE ANDROID: the release paths (beta/main), plus manual dispatch. One
# more trigger Android does not have: a develop PR that touches the iOS harness
# or the shared flows runs it too, because macOS is the only place this harness
# can be exercised at all — nobody can run it locally on Linux.
name: ios-e2e

on:
  pull_request:
    branches: [develop, beta, main]
  push:
    branches: [beta, main]
  # `flows` narrows a manual run to a few flows (`pnpm e2e:ci:ios`).
  workflow_dispatch:
    inputs:
      flows:
        description: >-
          Only these flows, comma-separated (e.g. `20,22` or
          `20-register-to-event`). Empty = the whole suite.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/beta' && github.ref != 'refs/heads/main' }}

jobs:
  # Decides whether the macOS job runs. A `paths:` filter on the trigger cannot
  # express this: it would apply to the beta/main PRs too, which must always run.
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" != develop ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(\.github/workflows/ios-e2e\.yml|scripts/(run-ios-e2e|build-ios-e2e-app)\.mjs|scripts/lib/(maestro-suite|e2e-build-env)\.mjs|apps/mobile/e2e/native/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  ios-e2e:
    name: iOS E2E (Maestro on a Simulator)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Expo SDK 56 needs Xcode 26.4+, which the macOS 26 image carries.
    runs-on: macos-26
    # A cold Release Xcode build (~35 min), ~15 min of setup (emulators, seed,
    # deep-link trust), then ~22 flows at ~3 min each — Maestro restarts its
    # XCTest driver for every flow, ~1 min apiece on iOS. 120 min cut run 8
    # off four flows short. Generous on purpose, as for Android: timing out
    # mid-suite tells you nothing.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # The Firebase emulators and Maestro both run on the JVM.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build shared package
        run: pnpm shared:build

      - name: Build functions
        run: pnpm functions:build

      # Downloaded pod sources only: `ios/` itself is regenerated by
      # `expo prebuild --clean` on every run.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-ios-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: pods-ios-e2e-${{ runner.os }}-

      # Prebuild + a Release Simulator build with USE_FIREBASE_EMULATOR=1.
      # Every non-obvious constraint lives in the script, so the local run and
      # this one produce the same app. Its last line is the .app path.
      - name: Build E2E app (emulator mode)
        run: |
          node scripts/build-ios-e2e-app.mjs | tee "$RUNNER_TEMP/ios-build.log"
          echo "E2E_IOS_APP=$(tail -n 1 "$RUNNER_TEMP/ios-build.log")" >> "$GITHUB_ENV"

      # Boot to completion BETWEEN the build and the suite, never overlapping
      # either: a cold boot pins the 3-core runner for minutes. Overlapping the
      # suite's start timed Maestro's driver out; overlapping the build halved
      # its speed. See --boot-only in scripts/run-ios-e2e.mjs.
      - name: Boot the Simulator
        run: node scripts/run-ios-e2e.mjs --boot-only

      # Same pin as android-e2e.yml: both platforms run one suite on one Maestro.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          # The installer silently falls back to latest if it ignores the
          # variable, so prove the pin took instead of trusting it.
          installed="$("$HOME/.maestro/bin/maestro" --version | tail -n1)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed installed, but $MAESTRO_VERSION is pinned."
            exit 1
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The exact command a developer runs locally on a Mac: boots the Firebase
      # emulators, seeds the deterministic E2E fixtures, then the runner boots a
      # Simulator, installs E2E_IOS_APP and runs the suite.
      - name: Seed + run the Maestro suite on a Simulator
        env:
          E2E_FIREBASE_PROJECT: cultuvilla-test
          # Empty on every event but a dispatch that names flows.
          E2E_NATIVE_FLOW: ${{ inputs.flows }}
        run: pnpm test:e2e:ios

      # always(), not !cancelled(): a timeout cancels the job, and the
      # screenshots of a run that timed out are exactly the ones needed.
      - name: Upload Maestro artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts-ios
          path: |
            apps/mobile/e2e/native/report/
            ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7
