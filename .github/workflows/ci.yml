name: CI

on:
  push:
    branches: [develop, beta, main]
  pull_request:
    branches: [develop, beta, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR refs — a run whose commit has been replaced is
  # dead work. But never on the branches a merge lands on: that run is the
  # integration check for the merge, and a concurrent pusher would erase it,
  # leaving the merge unverified with nothing to show for it.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/develop'
        && github.ref != 'refs/heads/beta'
        && github.ref != 'refs/heads/main' }}

env:
  # CI builds against dev and never talks to Firebase. Placeholder values
  # satisfy the fail-fast check in packages/shared/src/config/environments.ts.
  # Real deploy values live in apps/mobile/.env on the deployer's machine
  # (Expo bakes them into the static bundle); CI does not deploy.
  NEXT_PUBLIC_APP_ENV: dev
  NEXT_PUBLIC_FIREBASE_API_KEY_DEV: ci-placeholder
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_DEV: ci.example.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV: ci-placeholder
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_DEV: ci.example.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_DEV: '0'
  NEXT_PUBLIC_FIREBASE_APP_ID_DEV: ci-placeholder

jobs:
  ci:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # Downstream packages (functions, mobile) resolve @cultuvilla/shared via
      # its built dist/ (gitignored). Build it before any typecheck step
      # consumes it, otherwise module resolution fails.
      - name: Build shared package
        run: pnpm shared:build

      - name: Typecheck (shared, functions, i18n, mobile)
        run: pnpm typecheck

      - name: Lint (shared, functions)
        run: pnpm lint

      - name: Check no raw Firestore refs outside firebase/refs/
        run: pnpm check:no-raw-firestore-refs

      - name: Check no E2E test-login bypass leak
        run: pnpm check:no-test-login-leak

      # Warn-only: annotates backfill/migration/cleanup scripts that are not on
      # the registry, so they are invisible to `backfills:list` and the deploy
      # gate. Never fails — ~25 legacy scripts predate the registry and failing
      # on all of them would just get the check switched off.
      - name: Lint backfill registry coverage (warn only)
        run: pnpm backfills:lint

      - name: Test (unit — shared, mobile, functions)
        run: pnpm test:unit

      - name: Build (shared, functions)
        run: pnpm build

  emulator-tests:
    name: Emulator tests (integration + rules + functions)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools@15 will drop support for Java < 21; bumping ahead
          # of the deprecation removes the runtime warning and keeps the
          # emulator job working when firebase-tools rolls forward.
          java-version: '21'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      # functions:build (tsc) resolves @cultuvilla/shared via its built dist/,
      # so the shared package must be built first.
      - name: Build shared package
        run: pnpm shared:build

      - name: Build functions
        run: pnpm functions:build

      - name: All emulator-backed tests (shared + functions + mobile, one emulator boot)
        run: pnpm test
        env:
          VITEST_RETRY_COUNT: '1'


  # Changes that strand INSTALLED store clients — a removed/renamed callable, a
  # stored schema that got stricter (needs a pre-deploy backfill) or looser
  # (needs a trailer). Both scripts read only git, so no install is needed.
  # See docs/decisions/breaking-change-and-hard-wall.md.
  breaking-changes:
    name: Breaking-change guards (callables, stored schemas)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # setup-node@v5 turns on a pnpm cache by itself when package.json names a
      # packageManager, and fails without pnpm installed. Nothing is installed here.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # The checkout is `refs/pull/N/merge` at depth 1 with no origin/<base>,
      # so there is no merge-base until one is fetched — and without one the
      # guards cannot isolate the branch's own commits or read their trailers.
      - name: Fetch the merge-base with the PR base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci-fetch-merge-base.sh "$BASE_REF"

      # HEAD here is the PR merge commit; --no-merges in the scripts skips it,
      # so the trailers read are the PR's own commits.
      - name: Callable removal must be declared
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-callable-removal.mjs --base="origin/${BASE_REF}" --head=HEAD

      - name: Stored schema change must ship its backfill or be declared
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-schema-change.mjs --base="origin/${BASE_REF}" --head=HEAD
