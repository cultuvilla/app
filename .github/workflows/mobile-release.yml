name: mobile-release

# Builds the store binaries on EAS and hands them to Google Play / App Store
# Connect, on demand. The routine production release is automatic —
# production-release.yml builds Android and submits iOS on every
# version-bumping merge to main (docs/decisions/production-auto-release.md).
# This workflow is the manual escape hatch: a testing track (a closed test that
# has to run 14 days is not the same event as a production rollout), a rebuild,
# or a resubmit of a build Play rejected.
#
# Every track builds from the SAME `production` EAS profile — prod Firebase,
# package com.cultuvilla.app. Play's closed-testing requirement is per package
# name, so testing on the `com.cultuvilla.app.beta` build would NOT count toward
# production access for `com.cultuvilla.app`. Promote one artifact across tracks
# instead of building a different app per track.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store binary to build
        type: choice
        options: [android, ios, all]
        default: android
      track:
        description: 'Play track (android only): internal = fast smoke test, closed = starts the 14-day clock, production = public'
        type: choice
        options: [internal, closed, production]
        default: internal
      submit:
        description: Submit the build to the store after it succeeds
        type: boolean
        default: true
      testflightGroup:
        description: 'iOS only: TestFlight internal testing group to add the build to (leave blank to skip — the build still lands in App Store Connect either way)'
        type: string
        default: ''
      submitForReview:
        description: 'iOS only: after uploading, attach the build to the App Store version and submit it for review (auto-releases on approval, phased over 7 days)'
        type: boolean
        default: false
      androidBuildId:
        description: 'Android only: submit this already-finished EAS build (its id) to the chosen track instead of building a new one'
        type: string
        default: ''

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android (build${{ inputs.submit && format(' + submit -> {0}', inputs.track) || '' }})
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    # The EAS free-tier queue alone has exceeded an hour (1.4.1, 2026-09-28):
    # a runner timeout cancels only the wait, never the build or its
    # server-side auto-submit, so a short limit just hides the outcome.
    timeout-minutes: 150
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The mobile app resolves @cultuvilla/shared through the package's built
      # dist/, which is gitignored — EAS uploads the working tree as-is, so an
      # unbuilt shared package fails on the build server, not here.
      - name: Build shared package
        run: pnpm shared:build

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # eas.json points submit at ./google-play-service-account.json (relative to
      # apps/mobile). Gitignored via the repo-wide *service-account*.json rule;
      # materialised here from the secret and never persisted.
      - name: Write Google Play service account key
        if: ${{ inputs.submit || inputs.androidBuildId != '' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set — cannot submit to Play."
            exit 1
          fi
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" > apps/mobile/google-play-service-account.json

      - name: Show EAS remote version counters
        if: ${{ inputs.androidBuildId == '' }}
        working-directory: apps/mobile
        run: eas build:version:get --platform android --profile production --non-interactive

      - name: Build Android app bundle${{ inputs.submit && ' and submit' || '' }}
        if: ${{ inputs.androidBuildId == '' }}
        working-directory: apps/mobile
        run: |
          eas build \
            --profile production \
            --platform android \
            --non-interactive \
            --wait \
            ${{ inputs.submit && format('--auto-submit-with-profile {0}', inputs.track) || '' }}

      # Resubmitting a finished build skips the queue and keeps the versionCode:
      # a submit that fails on Play's side (permissions, a pending review) should
      # not cost a new build to retry.
      - name: Submit existing build ${{ inputs.androidBuildId }}
        if: ${{ inputs.androidBuildId != '' }}
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ inputs.androidBuildId }}
          TRACK: ${{ inputs.track }}
        run: |
          eas submit \
            --platform android \
            --profile "$TRACK" \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait

      - name: Remove service account key
        if: ${{ always() }}
        run: rm -f apps/mobile/google-play-service-account.json

  ios:
    name: iOS (build${{ inputs.submit && format(' + submit -> TestFlight{0}', inputs.testflightGroup != '' && format(' [{0}]', inputs.testflightGroup) || '') || '' }})
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm shared:build

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ascAppId/ascApiKeyId/ascApiKeyIssuerId only exist once the App Store Connect
      # app record and API key are created, and eas submit --non-interactive cannot
      # discover them. Fail here with a readable message rather than 40 minutes
      # later at the submit step.
      - name: Assert App Store Connect app is configured
        if: ${{ inputs.submit }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          missing=()
          [ -z "${ASC_APP_ID}" ] && missing+=("ASC_APP_ID")
          [ -z "${APPLE_ASC_KEY_ID}" ] && missing+=("APPLE_ASC_KEY_ID")
          [ -z "${APPLE_ASC_ISSUER_ID}" ] && missing+=("APPLE_ASC_ISSUER_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo variable(s): ${missing[*]} — create the app in App Store Connect and the ASC API key before submitting iOS."
            exit 1
          fi

      # --json pins the exact build this run made. Asking EAS afterwards for "the
      # latest finished build" could pick up a concurrent manual build instead,
      # and hand testers (or App Review) a binary this run never produced.
      - name: Build iOS archive
        id: ios_build
        working-directory: apps/mobile
        run: |
          eas build --profile production --platform ios --non-interactive --wait --json > ios-build.json
          node -e '
            const [b] = JSON.parse(require("fs").readFileSync("ios-build.json", "utf8"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `id=${b.id}\nbuild_number=${b.appBuildVersion}\n`);
          '

      # After the build, never before: eas.json is a fingerprint source, and
      # `eas build` uploads the project as it stands. Patching the ASC ids in
      # first gave every store binary a runtime version no clean checkout of
      # its commit reproduces, so no OTA update could ever reach it.
      # ascApiKeyPath points at the .p8 (relative to apps/mobile), gitignored
      # and never persisted; ascApiKeyId/ascApiKeyIssuerId only identify the
      # key and live in repo vars rather than in the committed eas.json.
      - name: Write App Store Connect API key
        if: ${{ inputs.submit }}
        env:
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_ASC_API_KEY_P8}" ]; then
            echo "::error::APPLE_ASC_API_KEY_P8 secret is not set — cannot submit to App Store Connect."
            exit 1
          fi
          printf '%s' "${APPLE_ASC_API_KEY_P8}" > apps/mobile/apple-asc-api-key.p8
          node -e "
            const fs = require('fs');
            const path = 'apps/mobile/eas.json';
            const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
            eas.submit.production.ios.ascApiKeyId = process.env.APPLE_ASC_KEY_ID;
            eas.submit.production.ios.ascApiKeyIssuerId = process.env.APPLE_ASC_ISSUER_ID;
            fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');
          "

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        run: |
          eas submit \
            --profile production \
            --platform ios \
            --id "${{ steps.ios_build.outputs.id }}" \
            --non-interactive \
            ${{ inputs.testflightGroup != '' && format('--groups "{0}"', inputs.testflightGroup) || '' }}

      # eas submit stops at the upload: the binary lands in App Store Connect and
      # sits there. Everything after — attaching it to an App Store version,
      # writing the notes, submitting for review — is ASC API work, and doing it
      # by hand is how 1.0.0 ended up approved-but-unreleased for two days.
      - name: Submit for App Store review
        if: ${{ inputs.submit && inputs.submitForReview }}
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_ASC_KEY_ID: ${{ vars.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ vars.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_API_KEY_P8: ${{ secrets.APPLE_ASC_API_KEY_P8 }}
        run: |
          BUILD_NUMBER="${{ steps.ios_build.outputs.build_number }}"
          echo "Submitting iOS build ${BUILD_NUMBER} for review."
          node scripts/appstore-release.mjs submit --build-number="${BUILD_NUMBER}" --apply

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f apps/mobile/apple-asc-api-key.p8
