name: mobile-ci

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'packages/i18n/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [develop, beta, main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The mobile app resolves the bare @cultuvilla/shared import via the
      # package's built dist/ (gitignored), so build it before typechecking.
      - name: Build shared package
        run: pnpm shared:build

      - name: Typecheck (mobile)
        run: pnpm app:typecheck

      - name: Test (mobile)
        run: pnpm app:test
