    <g fill="#f9f0e8" stroke="#c8714f" stroke-width="1.5">
      <ellipse cx="456" cy="152" rx="27" ry="9"/>
      <ellipse cx="456" cy="143" rx="27" ry="9"/>
      <ellipse cx="456" cy="134" rx="27" ry="9"/>
      <ellipse cx="456" cy="125" rx="27" ry="9"/>
      <ellipse cx="456" cy="116" rx="27" ry="9"/>
    </g>
    <ellipse cx="456" cy="116" rx="19" ry="5.5" fill="#dcab93"/>
