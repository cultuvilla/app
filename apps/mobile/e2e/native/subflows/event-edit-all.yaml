# Edit EVERY field of the event event-create-full.yaml made, on an open
# /crear/evento?eventId=…, so nothing the create step set survives unchanged:
#   output.editTitle, output.editDescription, output.editDay, output.editEndDay
# Organizers drop to the approval peña alone, which is what makes the event
# eligible to go private — and it does. Every switch flips back. One question
# is renamed, one removed, one added.
appId: com.cultuvilla.app.dev
---
- extendedWaitUntil:
    visible:
      id: 'event-title'
    timeout: 45000
- assertVisible: ${output.title}

# ── Step 1 ──
- runFlow:
    file: replace-text.yaml
    env:
      INPUT: 'event-title'
      TEXT: ${output.editTitle}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'event-cover'
      - runFlow:
          file: pick-photo.yaml
          env:
            INDEX: '1'
- runFlow:
    file: replace-text.yaml
    env:
      INPUT: 'event-description'
      TEXT: ${output.editDescription}
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'remove-user-e2e-user'
- tapOn:
    id: 'remove-user-e2e-user'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'remove-org-e2e-org-ayto'
- tapOn:
    id: 'remove-org-e2e-org-ayto'
- assertNotVisible:
    id: 'remove-org-e2e-org-ayto'
# One org left, and it admits by approval: the private switch appears, enabled.
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'private-to-org'
- tapOn:
    id: 'private-to-org'
- runFlow: close-keyboard.yaml
- tapOn:
    id: 'event-form-primary'

# ── Step 2 ── the end moves first: it may not precede the start, and the
# start is about to move past the old end.
- runFlow:
    file: pick-datetime.yaml
    env:
      FIELD: 'endDate'
      DAY: ${output.editEndDay}
      HOUR: '13'
      MINUTE: '0'
- runFlow:
    file: pick-datetime.yaml
    env:
      FIELD: 'startDate'
      DAY: ${output.editDay}
      HOUR: '11'
      MINUTE: '0'
- runFlow: close-keyboard.yaml
- tapOn:
    id: 'event-form-primary'

# ── Step 3 ── each switch back to its default; capacity changes.
- extendedWaitUntil:
    visible:
      id: 'signup-enabled'
    timeout: 10000
- runFlow:
    file: replace-text.yaml
    env:
      INPUT: 'event-max-attendees'
      TEXT: '30'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'birth-year-limit'
- tapOn:
    id: 'birth-year-limit'
- assertNotVisible:
    id: 'min-birth-year'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'telephone-required'
- tapOn:
    id: 'telephone-required'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'requires-payment'
- tapOn:
    id: 'requires-payment'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'signup-group-size'
- tapOn:
    id: 'signup-group-size'
- assertNotVisible:
    id: 'group-size-3'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'attendees-public'
- tapOn:
    id: 'attendees-public'
- runFlow: close-keyboard.yaml
- tapOn:
    id: 'event-form-primary'

# ── Step 4 ── rename the first question, drop the second, add a checkbox.
- extendedWaitUntil:
    visible:
      id: 'signup-question-0-summary'
    timeout: 15000
- tapOn:
    id: 'signup-question-0-summary'
- runFlow:
    file: replace-text.yaml
    env:
      INPUT: 'signup-question-label-0'
      TEXT: 'Talla de camiseta'
- tapOn:
    id: 'signup-question-1-summary'
- tapOn:
    id: 'signup-question-1-remove'
- assertNotVisible:
    id: 'signup-question-1-summary'
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: 'signup-question-add'
- tapOn:
    id: 'signup-question-add'
- tapOn:
    id: 'type-sheet-row-checkbox'
- runFlow:
    file: type-into.yaml
    env:
      INPUT: 'signup-question-label-1'
      TEXT: 'Alergias'
- runFlow: close-keyboard.yaml
- tapOn:
    id: 'event-form-primary'
