# Bring ${TARGET} on screen without ever pressing BACK.
#
# reveal.yaml presses BACK on Android when its target is hidden, to close a
# soft keyboard. Where no keyboard is up — after a sheet closes, a picker
# returns, or on an AVD whose hardware keyboard never raises one — that BACK
# leaves the screen instead (flow 60's first run ended on the Perfil tab).
# The long forms the deep flows walk use this. It closes a keyboard only when
# one is on screen: Gboard's window is in the hierarchy Maestro reads, so BACK
# is pressed only when it can do nothing but close it. iOS: see below.
appId: com.cultuvilla.app.dev
---
- runFlow:
    when:
      platform: Android
      visible:
        id: 'com.google.android.inputmethod.latin:id/keyboard_holder'
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
# iOS: not Enter, which types a newline into a multiline field (flow 60's
# description gained one, and the tap meant for the next button typed a G on
# the still-open keyboard). The forms' ScrollViews use
# keyboardShouldPersistTaps="handled", so a tap on the empty left gutter —
# no control lives there — closes the keyboard and nothing else.
- runFlow:
    when:
      platform: iOS
      visible:
        id: 'inputView'
    commands:
      - tapOn:
          point: '2%,30%'
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: DOWN
          timeout: 20000
