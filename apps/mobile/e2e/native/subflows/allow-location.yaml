# Answer Android's runtime location-permission dialog when it is up.
#
# `clearState` revokes runtime permissions, so the first location request in a
# flow raises the dialog; a later one in the same flow does not. Optional on
# both steps for that reason. The pattern covers an English and a Spanish AVD.
appId: com.cultuvilla.app.dev
---
- extendedWaitUntil:
    visible: '(?i)(while using the app|mientras se usa la aplicación|mientras la app está en uso)'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: '(?i)(while using the app|mientras se usa la aplicación|mientras la app está en uso)'
    commands:
      - tapOn: '(?i)(while using the app|mientras se usa la aplicación|mientras la app está en uso)'
