# Make the element with id TARGET reachable after typing.
#
# CI's AVD raises a soft keyboard on `inputText`, and it covers the bottom of
# the screen — the wizard's primary button, a form's submit. `hideKeyboard` is
# banned (androidE2e.test.ts) because it is a BACK press that walks out of the
# screen when no keyboard is up, as on a hardware-keyboard AVD. So BACK is sent
# only while TARGET is hidden — the one case where a keyboard is what hides it.
# If it is still hidden after that, it is genuinely below the fold: scroll.
#
# iOS gets no dismissal step at all. It has no BACK key; Maestro's iOS
# `hideKeyboard` failed on one form and opened the photo picker on another; and
# a tap on blank margin is a tap on a bottom sheet's BACKDROP, which closes the
# sheet whose confirm button this subflow was asked to reveal (flows 23 and 62).
# None is needed: Screen, BottomSheet and the sign-up sheets wrap their content
# in KeyboardAvoider, so it sits above the keyboard and the scroll below
# reaches it.
appId: com.cultuvilla.app.dev
---
- runFlow:
    when:
      platform: Android
      notVisible:
        id: ${TARGET}
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: DOWN
          timeout: 20000
