# Make the element with id TARGET reachable after typing.
#
# CI's AVD raises a soft keyboard on `inputText`, and it covers the bottom of
# the screen — the wizard's primary button, a form's submit. `hideKeyboard` is
# banned (androidE2e.test.ts) because it is a BACK press that walks out of the
# screen when no keyboard is up, as on a hardware-keyboard AVD. So BACK is sent
# only while TARGET is hidden — the one case where a keyboard is what hides it.
# If it is still hidden after that, it is genuinely below the fold: scroll.
#
# iOS has no BACK key, and Maestro's iOS `hideKeyboard` is no substitute: it
# failed outright on one form ("Couldn't hide the keyboard") and on another its
# gesture landed on the photo field and opened the picker. Instead the iOS
# branch taps the form's blank left margin: the form scroll views use
# keyboardShouldPersistTaps="handled", so a tap on non-touchable content just
# dismisses the keyboard. It runs unconditionally — Maestro's iOS visibility
# ignores occlusion, so a button under the keyboard reads as visible and a
# `notVisible` guard would never fire — and is a no-op with no keyboard up.
appId: com.cultuvilla.app.dev
---
- runFlow:
    when:
      platform: Android
      notVisible:
        id: ${TARGET}
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '2%,30%'
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: DOWN
          timeout: 20000
