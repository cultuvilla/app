# Make the element with id TARGET reachable after typing.
#
# CI's AVD raises a soft keyboard on `inputText`, and it covers the bottom of
# the screen — the wizard's primary button, a form's submit. `hideKeyboard` is
# banned (androidE2e.test.ts) because it is a BACK press that walks out of the
# screen when no keyboard is up, as on a hardware-keyboard AVD. So BACK is sent
# only while TARGET is hidden — the one case where a keyboard is what hides it.
# If it is still hidden after that, it is genuinely below the fold: scroll.
#
# On iOS the keyboard must really go: Maestro's iOS visibility ignores what the
# keyboard covers, so a submit button under it reads as visible and the tap
# lands on a key (flow 70 "submitted" a form that never was). The safe
# dismissal is the keyboard's own Return — nothing here handles
# onSubmitEditing, so a single-line field just blurs, and a multiline one gains
# a newline no flow asserts on. Not `hideKeyboard` (failed outright on one form,
# opened the photo picker on another) and not a margin tap (on a bottom sheet
# that is the backdrop, and closes the sheet). Only while a keyboard is up — its
# space key is the tell — since Return with no focused field errors.
appId: com.cultuvilla.app.dev
---
- runFlow:
    when:
      platform: Android
      notVisible:
        id: ${TARGET}
    commands:
      - pressKey: back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      platform: iOS
      visible: '(space|espacio)'
    commands:
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: DOWN
          timeout: 20000
