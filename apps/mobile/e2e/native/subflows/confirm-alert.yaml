# Tap a native Alert's confirming button — the one right of "Cancelar".
#
# Two traps, both seen on iOS:
#  - Maestro matches text case-insensitively, and the alert's TITLE (and often
#    an icon's label behind it) carry the same word as the button, so a bare
#    text tap can land on any of them. `rightOf: 'Cancelar'` picks the button on
#    both platforms (Android's Material dialog upper-cases both labels).
#  - On iOS 26 Maestro's quick synthetic tap can highlight an alert button
#    without activating it: the tap reports COMPLETED, the button glows, and
#    the alert stays up — re-tapping does the same. A press-and-hold is a whole
#    touch the button does act on, so that is the fallback while it stays up.
appId: com.cultuvilla.app.dev
---
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: ${BUTTON}
    rightOf: 'Cancelar'
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 3
    while:
      visible:
        text: ${BUTTON}
        rightOf: 'Cancelar'
    commands:
      - longPressOn:
          text: ${BUTTON}
          rightOf: 'Cancelar'
      - waitForAnimationToEnd:
          timeout: 3000
# Last resort, iOS only: neither a tap nor a hold has always pressed an iOS 26
# alert button from Maestro (the button lights up, the alert stays). Return is
# UIKit's keyboard path to an alert's confirming action; if it does nothing the
# flow's own backend assertion still decides, so it can hide nothing.
- runFlow:
    when:
      platform: iOS
      visible:
        text: ${BUTTON}
        rightOf: 'Cancelar'
    commands:
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 3000
