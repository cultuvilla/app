# Tap a native Alert's confirming button: the one right of "Cancelar", below
# the alert's message (every confirmation in the app asks a question).
#
# Maestro matches text case-insensitively, and the alert's TITLE and often an
# icon behind it carry the same word as the button. `rightOf` alone is not
# enough on iOS: the screen under an alert stays in the hierarchy there, and
# a header icon labelled "Eliminar" in the top-right corner is right of
# "Cancelar" too. Maestro tapped it instead of the button, so the alert never
# went away (flows 61 and 90). `below` the message keeps the pick inside the
# alert on both platforms.
appId: com.cultuvilla.app.dev
#
# iOS lays a two-button alert out side by side only while both labels are
# short; "Añadir al equipo" stacks the buttons, the confirming one ABOVE
# "Cancelar". Both layouts are tried, twice over: under load the first tap can
# land while the alert is still animating in.
---
# The checks below are instant, so first wait for the alert to be up.
- extendedWaitUntil:
    visible:
      text: ${BUTTON}
      below: '.*\?.*'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible:
              text: ${BUTTON}
              rightOf: 'Cancelar'
              below: '.*\?.*'
          commands:
            - tapOn:
                text: ${BUTTON}
                rightOf: 'Cancelar'
                below: '.*\?.*'
      - runFlow:
          when:
            visible:
              text: ${BUTTON}
              above: 'Cancelar'
              below: '.*\?.*'
          commands:
            - tapOn:
                text: ${BUTTON}
                above: 'Cancelar'
                below: '.*\?.*'
      - waitForAnimationToEnd:
          timeout: 3000
