# Pick a photo for a square image (an escudo, a profile photo): the picker
# opens its crop step after the pick (lib/imageCrop.ts, allowsEditing), which
# is accepted as framed.
#
# Android: expo-image-picker's crop screen, confirmed from its toolbar.
# iOS: the in-process picker's move-and-scale screen, confirmed with "Choose".
appId: com.cultuvilla.app.dev
---
- runFlow:
    file: pick-photo.yaml
    env:
      INDEX: '0'
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: 'com.cultuvilla.app.dev:id/crop_image_menu_crop'
    commands:
      - tapOn:
          id: 'com.cultuvilla.app.dev:id/crop_image_menu_crop'
- runFlow:
    when:
      visible: '(?i)(crop|recortar|choose|elegir|usar foto|use photo)'
    commands:
      - tapOn: '(?i)(crop|recortar|choose|elegir|usar foto|use photo)'
- waitForAnimationToEnd:
    timeout: 5000
