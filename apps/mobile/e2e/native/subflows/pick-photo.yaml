# Pick a photo in the OS picker that the app has just opened. The runner stocks
# it with PICKER_IMAGES (scripts/lib/maestro-suite.mjs); ${INDEX} is 0 or 1, so
# an edit can swap one for the other.
#
# Android: the system Photo Picker names its cells by resource id.
# iOS: PHPicker runs out of process. Its cells are labelled "Photo, <date>"
# (or "Foto, …") when the hierarchy reaches them; when it does not, a tap on
# the grid picks one. The tap sits at 45% height: iOS 18 opens the picker
# with a "Private Access to Photos" banner above the grid on first use, which
# a tap at 30% hits; at 45% it lands on the first row with the banner and on
# the second without it. Which photo is picked on iOS does
# not matter to any flow — only that one is.
appId: com.cultuvilla.app.dev
---
# Android has two pickers. Up to Android 14 its cells carry the resource id
# below. From Android 15/16 the picker is rewritten in Compose: no resource ids
# at all, only each cell's description, "Photo taken on <date>". Phones in
# users' hands run both, so the flow takes whichever one opened.
- runFlow:
    when:
      platform: Android
    commands:
      # Optional: the older picker may not label its cells, and then this
      # wait only gives its grid time to load.
      - extendedWaitUntil:
          visible: '(?i)(photo taken on|foto tomada el).*'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible:
              id: 'com.google.android.providers.media.module:id/icon_thumbnail'
          commands:
            - runFlow:
                when:
                  true: ${INDEX == 0}
                commands:
                  - tapOn:
                      id: 'com.google.android.providers.media.module:id/icon_thumbnail'
                      index: 0
            - runFlow:
                when:
                  true: ${INDEX == 1}
                commands:
                  - tapOn:
                      id: 'com.google.android.providers.media.module:id/icon_thumbnail'
                      index: 1
            - extendedWaitUntil:
                notVisible:
                  id: 'com.google.android.providers.media.module:id/icon_thumbnail'
                timeout: 15000
      - runFlow:
          when:
            visible: '(?i)(photo taken on|foto tomada el).*'
          commands:
            - tapOn:
                text: '(?i)(photo taken on|foto tomada el).*'
                index: ${INDEX}
            - extendedWaitUntil:
                notVisible: '(?i)(photo taken on|foto tomada el).*'
                timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible:
              text: '(Photo|Foto),.*'
          commands:
            - tapOn:
                text: '(Photo|Foto),.*'
                index: ${INDEX}
      - runFlow:
          when:
            visible:
              text: '(?i)(cancel|cancelar)'
          commands:
            - runFlow:
                when:
                  true: ${INDEX == 0}
                commands:
                  - tapOn:
                      point: '17%,45%'
            - runFlow:
                when:
                  true: ${INDEX == 1}
                commands:
                  - tapOn:
                      point: '50%,45%'
      - waitForAnimationToEnd:
          timeout: 5000
      - assertNotVisible:
          text: '(?i)(cancel|cancelar)'
