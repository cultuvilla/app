# Set the partial-date field ${FIELD} (PartialDateField: a birthday, a death
# date) to ${YEAR}, month option ${MONTH_OPTION} and day ${DAY}. Month
# options are indexed from 0: option 5 is June, stored as 6.
#
# Each picker is a full-screen list with a Cancelar bar at its foot; an option
# just above that bar counts as visible but the tap lands on the bar, so each
# option is centred first. A list may open scrolled past the option (it
# follows the current value), so it is sought upwards before downwards.
appId: com.cultuvilla.app.dev
---
- runFlow:
    file: scroll-to.yaml
    env:
      TARGET: '${FIELD}-year'
- tapOn:
    id: '${FIELD}-year'
- scrollUntilVisible:
    element:
      id: '${FIELD}-year-option-${YEAR}'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      id: '${FIELD}-year-option-${YEAR}'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: '${FIELD}-year-option-${YEAR}'
- tapOn:
    id: '${FIELD}-month'
- scrollUntilVisible:
    element:
      id: '${FIELD}-month-option-${MONTH_OPTION}'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      id: '${FIELD}-month-option-${MONTH_OPTION}'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: '${FIELD}-month-option-${MONTH_OPTION}'
- tapOn:
    id: '${FIELD}-day'
- scrollUntilVisible:
    element:
      id: '${FIELD}-day-option-${DAY}'
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      id: '${FIELD}-day-option-${DAY}'
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: '${FIELD}-day-option-${DAY}'
