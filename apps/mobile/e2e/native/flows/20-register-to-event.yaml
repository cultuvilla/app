# The canonical native journey: sign in, open the seeded event,
# sign yourself up through the attendee sheet.
#
# The STRONG assertion is the backend effect read straight off the Firestore
# emulator (registration doc + the denormalized confirmedCount the Cloud Function
# trigger writes) — not the screen. That is the portable half of the substrate;
# the UI assertion below is the fragile half and comes second.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-user@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  EVENT_ID: e2e-event-fiesta
  PERSON_ID: e2e-person-user
---
# `clearState` + cold-start openLink live in the login subflow — see the note
# there on why a launchApp-then-openLink sequence drops the login intent.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://altozano-de-prueba/evento/_${EVENT_ID}'
- extendedWaitUntil:
    visible:
      id: 'register-fab'
    timeout: 45000
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: 'register-fab'
      EXPECT: 'attendee-list'
- tapOn:
    id: 'attendee-row-${PERSON_ID}'
- tapOn:
    id: 'attendee-confirm'

# Backend truth: a registration doc for this persona exists.
- runScript:
    file: ../scripts/queryCollection.js
    env:
      COLLECTION_PATH: 'events/${EVENT_ID}/registrations'
      FIELD: personId
      VALUE: ${PERSON_ID}
      MIN: '1'
- assertTrue: ${output.ok == 'true'}

# And the denormalized count the onRegistrationWrite trigger maintains moved.
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'events/${EVENT_ID}'
      FIELD: confirmedCount
      EXPECT: '>=1'
- assertTrue: ${output.ok == 'true'}

# Only now the UI: the FAB flips out of its sign-up CTA ("Apuntarme") into the
# signed-up tally ("Apuntado (1)"). Maestro text selectors are regexes matched
# against the WHOLE string, hence the trailing `.*` — same shape as the web
# spec's /Apuntad/.
- runFlow: ../subflows/dismiss-push-soft-ask.yaml
- extendedWaitUntil:
    visible: '.*Apuntad.*'
    timeout: 20000
