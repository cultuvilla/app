# Signing up a DEPENDENT persona — the multi-persona model that distinguishes
# Cultuvilla from a generic events app.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-user@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  EVENT_ID: e2e-event-fiesta
  DEPENDENT_ID: e2e-person-dependent
---
# `clearState` + cold-start openLink live in the login subflow — see the note
# there on why a launchApp-then-openLink sequence drops the login intent.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://altozano-de-prueba/evento/_${EVENT_ID}'
- extendedWaitUntil:
    visible:
      id: 'register-fab'
    timeout: 45000
- runFlow:
    file: ../subflows/tap-until.yaml
    env:
      TAP: 'register-fab'
      EXPECT: 'attendee-list'
# The sheet opens with whoever is already registered ticked, so tapping only the
# dependent row adds it without disturbing the attendee's own registration.
- tapOn:
    id: 'attendee-row-${DEPENDENT_ID}'
- tapOn:
    id: 'attendee-confirm'
- runScript:
    file: ../scripts/queryCollection.js
    env:
      COLLECTION_PATH: 'events/${EVENT_ID}/registrations'
      FIELD: personId
      VALUE: ${DEPENDENT_ID}
      MIN: '1'
- assertTrue: ${output.ok == 'true'}
