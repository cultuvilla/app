# A freshly-authenticated account with no profile is diverted to complete-profile
# by the AuthGate, and completes the three-step person form with EVERY field:
# names, nickname, sex, terms; birthday, birthplace, village and barrio; photo,
# biography and occupations (a catalog one and a custom one). Each is then
# checked on the stored person, profile and membership, and on the profile tab.
#
# Tap `accept-terms-box`, not `accept-terms`: the latter is the whole consent
# row, and its centre sits on the "Términos de uso" link.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-fresh@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  UID: e2e-fresh
---
- runFlow:
    file: ../subflows/login-fresh.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

# ── Step 1: who ──
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'person-given-name'
      TEXT: 'Nueva'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'person-first-surname'
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'person-first-surname'
      TEXT: 'Vecina'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'person-second-surname'
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'person-second-surname'
      TEXT: 'DePrueba'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'person-nickname'
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'person-nickname'
      TEXT: 'Nuevita'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'person-sex-female'
- tapOn:
    id: 'person-sex-female'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'accept-terms-box'
- tapOn:
    id: 'accept-terms-box'
- runFlow: ../subflows/close-keyboard.yaml
- tapOn:
    id: 'person-form-primary'

# ── Step 2: where ── (month option 4 is May)
- runFlow:
    file: ../subflows/pick-birthday.yaml
    env:
      YEAR: '1990'
      MONTH_OPTION: '4'
      DAY: '15'
- runFlow:
    file: ../subflows/pick-village.yaml
    env:
      PICKER: 'person-birth-place'
      SEARCH: 'Solana'
      VILLAGE_ID: 'e2e-village-solana'
- runFlow:
    file: ../subflows/pick-village.yaml
    env:
      PICKER: 'onboarding-village'
      SEARCH: 'Altozano'
      VILLAGE_ID: 'e2e-village-altozano'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'onboarding-barrio'
- tapOn:
    id: 'onboarding-barrio'
- extendedWaitUntil:
    visible:
      id: 'onboarding-barrio-option-e2e-barrio-alto'
    timeout: 20000
- tapOn:
    id: 'onboarding-barrio-option-e2e-barrio-alto'
- runFlow: ../subflows/close-keyboard.yaml
- tapOn:
    id: 'person-form-primary'

# ── Step 3: about ──
- extendedWaitUntil:
    visible:
      id: 'person-photo'
    timeout: 10000
- tapOn:
    id: 'person-photo'
- runFlow: ../subflows/pick-photo-square.yaml
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'person-biography'
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'person-biography'
      TEXT: 'Nacida en Solana y vecina de Altozano'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'occupation-agricultor'
- tapOn:
    id: 'occupation-agricultor'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'occupation-otro'
- tapOn:
    id: 'occupation-otro'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'occupation-custom-input'
- runFlow:
    file: ../subflows/type-into.yaml
    env:
      INPUT: 'occupation-custom-input'
      TEXT: 'Pastora'
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: 'occupation-custom-add'
- tapOn:
    id: 'occupation-custom-add'
- runFlow: ../subflows/close-keyboard.yaml
- tapOn:
    id: 'person-form-primary'

# ── Every stored field ──
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'users/${UID}'
      TIMEOUT_MS: '90000'
      EXPECT_JSON: >-
        {
          'personId': 'present',
          'activeMunicipalityId': 'e2e-village-altozano',
          'termsVersion': 'present'
        }
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'users/${UID}'
      FIELD: personId
      EXPECT: present
- evalScript: ${output.personId = output.value}
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'persons/${output.personId}'
      TIMEOUT_MS: '60000'
      EXPECT_JSON: >-
        {
          'givenName': 'Nueva',
          'firstSurname': 'Vecina',
          'secondSurname': 'DePrueba',
          'nickname': 'Nuevita',
          'sex': 'female',
          'userId': 'e2e-fresh',
          'birthday.year': 1990,
          'birthday.month': 5,
          'birthday.day': 15,
          'birthPlace.municipalityId': 'e2e-village-solana',
          'municipalityLinks.0.municipalityId': 'e2e-village-altozano',
          'municipalityLinks.0.barrioId': 'e2e-barrio-alto',
          'biography': 'Nacida en Solana y vecina de Altozano',
          'occupations': { 'contains': ['agricultor', 'Pastora'] },
          'photoURL': { 'prefix': 'http' }
        }
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'municipalities/e2e-village-altozano/members/${UID}'
      EXPECT_JSON: "{ 'role': 'user' }"

# ── The profile tab ──
- openLink: 'cultuvilla://perfil'
- extendedWaitUntil:
    visible:
      id: 'profile-edit-action'
    timeout: 60000
- runFlow: ../subflows/dismiss-push-soft-ask.yaml
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Nueva Vecina'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Nacida en Solana y vecina de Altozano'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Pastora'
