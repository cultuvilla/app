# A freshly-authenticated account with no profile is diverted to complete-profile
# by the AuthGate, and completes the three-step person form.
#
# High value natively and nowhere else: this is the app's only multi-step form
# with native pickers, and the step gating (terms acceptance, required birthday)
# is exactly the kind of thing that behaves differently on a real device.
#
# TWO Maestro traps are designed around here, both of which cost an afternoon:
#
#  - NO `hideKeyboard`. On Android it is a BACK press. When the soft keyboard is
#    up that closes it; when it is not — and on an AVD with a hardware keyboard
#    `inputText` never raises one — the same BACK walks out of the screen, and
#    the next step fails with "element not found" while the app sits on the
#    launcher.
#  - Tap `accept-terms-box`, not `accept-terms`. The latter is the whole consent
#    ROW, and its centre sits on the "Términos de uso" link — a centre-tap opens
#    the legal screen instead of ticking the box, and every later step then
#    fails against the wrong screen.
#  - Scroll ONLY when the element is genuinely off-screen, via `runFlow: when:`.
#    Each step of this form fits a phone screen with no keyboard, and
#    `scrollUntilVisible` on an unscrollable screen does not no-op: it burns its
#    timeout and fails, pointing at a field that was visible all along. But with
#    a soft keyboard up the lower controls ARE covered — so the scroll has to be
#    conditional rather than present or absent.
#
# Strong assertion: users/{uid}.personId links a persons/{id} that exists —
# precisely what authRoute reads to consider the user onboarded.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-fresh@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  UID: e2e-fresh
---
- runFlow:
    file: ../subflows/login-fresh.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

# Step 1 — identity. Terms acceptance gates the step, so accept before advancing.
- runFlow:
    when:
      notVisible:
        id: 'person-given-name'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-given-name'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-given-name'
- inputText: 'Nueva'
- runFlow:
    when:
      notVisible:
        id: 'person-first-surname'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-first-surname'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-first-surname'
- inputText: 'Vecina'
- runFlow:
    when:
      notVisible:
        id: 'person-second-surname'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-second-surname'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-second-surname'
- inputText: 'DePrueba'
# The soft keyboard covers the bottom ~45% of a pixel_5, and `scrollUntilVisible`
# CANNOT get out from under it: Maestro's swipe starts at the screen centre,
# which sits right on the keyboard's top edge, so the gesture is absorbed and the
# list barely moves. Swipe explicitly instead, with BOTH endpoints above the
# keyboard, and repeat until the target surfaces.
#
# A swipe is also the only option that keeps the focused field focused —
# `hideKeyboard` is banned suite-wide (androidE2e.test.ts: on Android it is a
# BACK press, which walks out of the screen on a hardware-keyboard AVD), and
# tapping a label to dismiss does not work either: the label belongs to the
# Input's own subtree, so Maestro resolves the text to the FIELD and taps it,
# re-opening the keyboard it was meant to close.
#
# Everything from the sex selector down (terms box, submit) is below the fold
# with the keyboard up, so this is the one place the flow needs it.
- repeat:
    times: 25
    while:
      notVisible:
        id: 'person-sex-female'
    commands:
      # 45% -> 15%, NOT 50% -> 12%: this flow reached the end of the form with
      # these exact numbers, and regressed the moment the stroke was widened.
      # A start at 50% lands on a text field rather than on inert form
      # background, so the gesture is taken as a text interaction instead of a
      # scroll. Both endpoints must also stay clear of the keyboard.
      - swipe:
          start: 45%, 45%
          end: 45%, 15%
- runFlow:
    when:
      notVisible:
        id: 'person-sex-female'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-sex-female'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-sex-female'
- runFlow:
    when:
      notVisible:
        id: 'accept-terms-box'
    commands:
      - scrollUntilVisible:
          element:
            id: 'accept-terms-box'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'accept-terms-box'
- runFlow:
    when:
      notVisible:
        id: 'person-form-primary'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-form-primary'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-form-primary'

# Step 2 — residence: only the birthday is required. Each segment opens a Modal
# with a FlatList, so the option itself is genuinely off-screen and gets an
# unconditional scroll.
- runFlow:
    when:
      notVisible:
        id: 'birthday-year'
    commands:
      - scrollUntilVisible:
          element:
            id: 'birthday-year'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'birthday-year'
- scrollUntilVisible:
    element:
      id: 'birthday-year-option-1990'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'birthday-year-option-1990'
- runFlow:
    when:
      notVisible:
        id: 'birthday-month'
    commands:
      - scrollUntilVisible:
          element:
            id: 'birthday-month'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'birthday-month'
- scrollUntilVisible:
    element:
      id: 'birthday-month-option-4'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'birthday-month-option-4'
- runFlow:
    when:
      notVisible:
        id: 'birthday-day'
    commands:
      - scrollUntilVisible:
          element:
            id: 'birthday-day'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'birthday-day'
- scrollUntilVisible:
    element:
      id: 'birthday-day-option-15'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'birthday-day-option-15'
- runFlow:
    when:
      notVisible:
        id: 'person-form-primary'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-form-primary'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-form-primary'

# Step 3 — about: every field optional, submit straight through.
- runFlow:
    when:
      notVisible:
        id: 'person-form-primary'
    commands:
      - scrollUntilVisible:
          element:
            id: 'person-form-primary'
          direction: DOWN
          timeout: 20000
- tapOn:
    id: 'person-form-primary'

- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'users/${UID}'
      FIELD: personId
      EXPECT: present
      # 30s expired with "Crear perfil" still spinning on CI: creating the
      # person, linking it onto the user and running the denormalisation
      # triggers is a lot slower on a loaded emulator than on a laptop.
      TIMEOUT_MS: '90000'
- assertTrue: ${output.exists == 'true'}
- assertTrue: ${output.value != ''}
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'persons/${output.value}'
      EXPECT: present
- assertTrue: ${output.ok == 'true'}
