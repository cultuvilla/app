# An org's invite link (…/entidad/<ref>/unirse) lands on the org with the
# invitation banner, and joining from there files a request. Asking follows the
# group (onOrgJoinRequestCreated), and withdrawing the request keeps the follow,
# which the follow button then drops and restores. Then the joiner leaves the
# peña flow 72 admitted them to, from the top bar's exit action.
#
# The route is only a redirect to the org detail with `?intent=join`, which is
# exactly what can break silently: a link that resolves to the wrong screen, or
# to no banner.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-joiner@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  JOINER_UID: e2e-joiner
  ORG_ID: e2e-org-ayto
  MEMBER_ORG_ID: e2e-org-pena-cerrada
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://altozano-de-prueba/entidad/_${ORG_ID}/unirse'
- extendedWaitUntil:
    visible: 'Te han invitado a unirte a este grupo'
    timeout: 45000
# A tap right after the deep-linked screen appears can be dropped on iOS (see
# subflows/tap-until.yaml). A filed request changes the label, so tap again if
# it has not.
- tapOn:
    id: 'join-org-fab'
- extendedWaitUntil:
    visible: 'Solicitud enviada'
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: 'Solicitud enviada'
    commands:
      - tapOn:
          id: 'join-org-fab'
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/joinRequests/${JOINER_UID}'
      EXPECT: present
- assertTrue: ${output.ok == 'true'}
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/members/${JOINER_UID}'
      EXPECT: absent
- assertTrue: ${output.ok == 'true'}
# The trigger's first call boots the worker.
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/followers/${JOINER_UID}'
      EXPECT: present
      TIMEOUT_MS: '180000'
- assertTrue: ${output.ok == 'true'}
- tapOn:
    id: 'join-org-fab'
- runFlow:
    file: ../subflows/confirm-alert.yaml
    env:
      BUTTON: 'OK'
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/joinRequests/${JOINER_UID}'
      EXPECT: absent
- assertTrue: ${output.ok == 'true'}
- extendedWaitUntil:
    visible: 'Siguiendo'
    timeout: 20000
- tapOn:
    id: 'org-follow-button'
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/followers/${JOINER_UID}'
      EXPECT: absent
- assertTrue: ${output.ok == 'true'}
- extendedWaitUntil:
    visible: 'Seguir'
    timeout: 20000
- tapOn:
    id: 'org-follow-button'
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${ORG_ID}/followers/${JOINER_UID}'
      EXPECT: present
- assertTrue: ${output.ok == 'true'}

# ── Leaving the peña flow 72 admitted them to. ──
- openLink: 'cultuvilla://altozano-de-prueba/entidad/_${MEMBER_ORG_ID}'
- extendedWaitUntil:
    visible:
      id: 'org-leave-action'
    timeout: 45000
- tapOn:
    id: 'org-leave-action'
- runFlow:
    file: ../subflows/confirm-alert.yaml
    env:
      BUTTON: 'Salir'
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'organizations/${MEMBER_ORG_ID}/members/${JOINER_UID}'
      FIELD: role
      EXPECT: absent
- assertTrue: ${output.ok == 'true'}
- extendedWaitUntil:
    visible:
      id: 'join-org-fab'
    timeout: 20000
