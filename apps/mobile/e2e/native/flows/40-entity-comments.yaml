# Posting a comment on an entity detail screen: the RN TextInput + soft
# keyboard + send round trip.
#
# The comment body is stamped with the current time so a re-run never asserts on
# a leftover from the previous one.
appId: com.cultuvilla.app.dev
env:
  EMAIL: e2e-user@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  EVENT_ID: e2e-event-fiesta
---
# `clearState` + cold-start openLink live in the login subflow — see the note
# there on why a launchApp-then-openLink sequence drops the login intent.
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://altozano-de-prueba/evento/_${EVENT_ID}'
- evalScript: ${output.body = 'Comentario nativo ' + Date.now()}
# EntityComments renders below the hero image, the body and the organiser row,
# so on a phone-sized screen it starts off the fold, and Maestro does not
# scroll implicitly.
- scrollUntilVisible:
    element:
      id: 'comment-input'
    direction: DOWN
    timeout: 45000
- tapOn:
    id: 'comment-input'
- inputText: ${output.body}
# Send with the arrow, exactly as a user does.
#
# It used to be `pressKey: Enter`, because the composer was a single-line field
# carrying `returnKeyType="send"` + `onSubmitEditing`. `Input` now takes
# `autoGrow`, which implies `multiline: true` so a long comment wraps instead of
# scrolling sideways — and a multiline field has no submit key: Enter inserts a
# newline. The old flow therefore typed a comment, pressed Enter, and asserted
# on a document that was never written.
#
# Tapping the arrow was previously unreliable — a synthetic tap reported
# COMPLETED while the handler never fired — because the first tap with the
# keyboard up was swallowed by the scroll view's keyboard-dismiss responder.
# `EntityDetailScaffold` now sets `keyboardShouldPersistTaps="handled"`, which
# is precisely the fix for that, and wraps the scroll region in a
# KeyboardAvoidingView that scrolls the composer above the keyboard on focus and
# as the field grows. So the arrow is now both on screen and a one-tap target.
#
# WAIT for it rather than asserting immediately. The arrow only renders once the
# field is non-empty (`visible={body.trim().length > 0}`), and the composer is
# still moving when the text lands: the keyboard is animating up and the
# KeyboardAvoidingView + on-grow auto-scroll are repositioning the field under
# it. A bare `assertVisible` races that settle and fails on a slow AVD while
# passing on a fast one — it did exactly that, green on one runner and red on
# another for the identical commit. `extendedWaitUntil` polls instead of
# sampling once, so the step is decided by whether the arrow ever becomes
# reachable, not by how quickly this runner got there.
- extendedWaitUntil:
    visible:
      id: 'comment-send'
    timeout: 30000
- tapOn:
    id: 'comment-send'
# No `hideKeyboard` — on Android that is a BACK press, and with no soft keyboard
# up (this AVD has a hardware one) it walks straight out of the screen.
# Strong assertion on the backend, not on the list. The composer sits at the
# bottom of a long scroll and the keyboard re-lays the screen out on send, so
# "is the new comment on screen" is a question about scroll position as much as
# about the round trip — the doc landing in Firestore is the fact worth pinning.
- runScript:
    file: ../scripts/queryCollection.js
    env:
      COLLECTION_PATH: comments
      FIELD: body
      VALUE: ${output.body}
      MIN: '1'
- assertTrue: ${output.ok == 'true'}
# And the denormalized count the syncEntityCommentCount trigger maintains moved,
# which the UI list reads from.
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: 'events/${EVENT_ID}'
      FIELD: commentCount
      EXPECT: '>=1'
- assertTrue: ${output.ok == 'true'}
