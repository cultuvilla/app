# Native anonymous deep-link smoke. It proves the whole native
# substrate boots end to end — standalone APK + emulator-connect (via 10.0.2.2)
# + seeded data + deep-link routing — before any interaction, so a failure here
# localises setup problems fast.
#
# Anonymous ON PURPOSE: it needs no login, so a failure here is never the
# fixture-login seam's fault. That makes it the first flow to read when the
# suite goes red.
#
# `clearState` + `openLink` on a stopped app, not `launchApp` then `openLink`:
# an intent delivered to a RUNNING app is a one-shot event that the app's JS is
# usually not yet mounted to receive. A cold start makes the link the launch
# intent, which `Linking.getInitialURL()` replays once the listener is ready.
#
# The event id/title below mirror scripts/data/seed-fixtures/e2e/fixtures.mjs
# (`event.docId` / `event.title`). Maestro YAML can't import JS — keep them in
# sync by hand.
#
# `appId` is the dev build's Android package (app.config.ts bundleIdPerEnv.dev),
# the only env allowed to arm the emulator bypass.
appId: com.cultuvilla.app.dev
---
- clearState
- openLink: cultuvilla://altozano-de-prueba/evento/_e2e-event-fiesta
- extendedWaitUntil:
    visible: 'Fiesta de Prueba E2E'
    timeout: 90000
# Anonymous visitor gets the guest sign-up CTA.
#
# Scroll to it first. The CTA sits below the fold on a pixel_5 once the
# full-bleed hero, title, date/location cards, organisers and village have had
# their say. Guarded by `when: notVisible` so a
# future layout that does fit it on screen doesn't start scrolling past it.
#
# The CTA can render well after the title on a cold iOS simulator, and two
# Maestro 2.11.0 behaviours turn that into a failure:
# - an extendedWaitUntil's timeout counts from the last command that acted on
#   the app, not from its own start (Orchestra.kt, adjustedToLatestInteraction).
#   After the title wait the clock still reads from openLink, so a slow title
#   used to leave the CTA wait nothing.
#   `waitForAnimationToEnd` acts, so it restarts the clock.
# - scrollUntilVisible looks before each swipe, never after the last one, and
#   an iOS swipe's own settle has taken 18 s. A CTA that renders during that
#   settle is on screen when the scroll gives up — so the scroll is optional
#   and the required wait after it is what decides.
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Apuntarme'
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: 'Apuntarme'
    commands:
      - scrollUntilVisible:
          element:
            text: 'Apuntarme'
          direction: DOWN
          timeout: 20000
          optional: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Apuntarme'
    timeout: 15000

# A guest's sign-up opens the register sheet. It has no ✕: dragging the grab
# bar down closes it, on both platforms.
- tapOn: 'Apuntarme'
- extendedWaitUntil:
    visible:
      id: 'register-sheet-handle'
    timeout: 15000
- swipe:
    from:
      id: 'register-sheet-handle'
    direction: DOWN
    duration: 400
- extendedWaitUntil:
    notVisible:
      id: 'register-sheet-handle'
    timeout: 5000

# A seat-claim link asks a signed-out visitor to sign in before anything else;
# the token is only read once they claim, so any token shows it.
- openLink: cultuvilla://altozano-de-prueba/evento/_e2e-event-fiesta/plaza/e2e-any-token
- extendedWaitUntil:
    visible:
      id: 'claim-sign-in'
    timeout: 60000
