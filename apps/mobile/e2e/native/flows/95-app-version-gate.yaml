# The force-update gate, both halves: a nudge the user can dismiss, then a wall
# they cannot.
#
# The gate listens to `config/appVersion` for the whole session and fails OPEN
# on a missing or malformed doc. Unit tests cover the decision; only a device
# proves the wiring — that the doc is read, the modal mounts over the app, a
# wall raised mid-session lands without a relaunch, and hardware BACK cannot
# escape the wall. (1.5.0 read the doc once at launch; that one read timed out
# and the wall never showed.)
#
# Versions are deliberately extreme (99.0.0 / 0.0.0) so no release bump of the
# APK's own version can change the outcome.
#
# Runs LAST and deletes the doc on the way out: the doc is global, and a
# leftover wall would sit over every flow after it.
appId: com.cultuvilla.app.dev
onFlowComplete:
  - runScript:
      file: ../scripts/deleteDoc.js
      env:
        DOC_PATH: config/appVersion
  - assertTrue: ${output.status == '200'}
---
# Nudge: a newer version exists, the installed one is still supported.
- runScript:
    file: ../scripts/appVersionConfig.js
    env:
      MIN_SUPPORTED: 0.0.0
      LATEST: 99.0.0
- runScript:
    file: ../scripts/docField.js
    env:
      DOC_PATH: config/appVersion
      EXPECT: present
- assertTrue: ${output.ok == 'true'}
# The nudge's cooldown lives in AsyncStorage, so a clean launch is what makes
# it fire.
- clearState
- openLink: 'cultuvilla://perfil'
- extendedWaitUntil:
    visible:
      id: 'app-update-modal'
    timeout: 90000
- assertVisible: 'Nueva actualización disponible'
- assertVisible:
    id: 'app-update-cta'
# The dismiss tap can land while the modal is still animating in, and iOS
# drops it (see subflows/tap-until.yaml): tap again while the modal stays.
- tapOn:
    id: 'app-update-dismiss'
- extendedWaitUntil:
    notVisible:
      id: 'app-update-modal'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'app-update-modal'
    commands:
      - tapOn:
          id: 'app-update-dismiss'
- extendedWaitUntil:
    notVisible:
      id: 'app-update-modal'
    timeout: 5000

# Wall, raised while the app is open: no relaunch, the listener must deliver it.
- runScript:
    file: ../scripts/appVersionConfig.js
    env:
      MIN_SUPPORTED: 99.0.0
      LATEST: 99.0.0
- extendedWaitUntil:
    visible: 'Actualización necesaria'
    timeout: 30000

# Wall at launch: a fresh start answers from the doc, not only from a change.
- clearState
- openLink: 'cultuvilla://perfil'
- extendedWaitUntil:
    visible:
      id: 'app-update-modal'
    timeout: 90000
- assertVisible: 'Actualización necesaria'
# No way out: no dismiss, and BACK is swallowed. The CTA is not tapped — it
# leaves for the store. iOS has no BACK key, so only the dismiss check applies.
- assertNotVisible:
    id: 'app-update-dismiss'
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- assertVisible:
    id: 'app-update-modal'
