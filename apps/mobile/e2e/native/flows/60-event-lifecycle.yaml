# The whole life of an event, with every field the wizard has:
#
#   create  — every field set off its default (subflows/event-create-full.yaml)
#   assert  — each stored field, then what the detail screen shows
#   others  — a co-organizer may edit; a villager may only read
#   edit    — every field changed again, ending private to the approval peña
#             (subflows/event-edit-all.yaml)
#   assert  — the stored doc and the screen again; an outsider can no longer see it
#   cancel  — the organizer's delete, which cancels rather than deletes
#
# It replaces a flow that typed a title, accepted every default and checked
# three fields — green while most of the form went untested. Sign-up with
# answers to the questions stays in 62 until the registration flow takes it.
#
# Cover images are picked on Android only; see subflows/pick-photo.yaml.
# Times sit mid-day so the stored UTC date matches the local one in any
# timezone a runner is likely to have.
appId: com.cultuvilla.app.dev
env:
  ADMIN_EMAIL: e2e-admin@cultuvilla.test
  ORGANIZER_EMAIL: e2e-user@cultuvilla.test
  VILLAGER_EMAIL: e2e-joiner@cultuvilla.test
  PASSWORD: e2e-cultuvilla-pw
  VILLAGE_ID: e2e-village-altozano
  VILLAGE_SLUG: altozano-de-prueba
---
- runScript: ../scripts/eventLifecycleValues.js

# ── Create ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
      PASSWORD: ${PASSWORD}
- setLocation:
    latitude: 39.4699
    longitude: -0.3763
- openLink: 'cultuvilla://crear/evento'
- runFlow: ../subflows/event-create-full.yaml
- runScript:
    file: ../scripts/queryCollection.js
    env:
      COLLECTION_PATH: events
      FIELD: title
      VALUE: ${output.title}
      FIELD2: status
      VALUE2: published
      MIN: '1'
      # Upload + create outlasted the default 20 s on the loaded macOS runner.
      TIMEOUT_MS: '60000'
- assertTrue: ${output.ok == 'true'}
- evalScript: ${output.eventId = output.id}

# ── Every stored field ──
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'events/${output.eventId}'
      EXPECT_JSON: >-
        {
          'title': '${output.title}',
          'description': '${output.description}',
          'status': 'published',
          'municipalityId': '${VILLAGE_ID}',
          'villageSlug': '${VILLAGE_SLUG}',
          'createdBy': 'e2e-admin',
          'organizerUserIds': ['e2e-admin', 'e2e-user'],
          'organizerOrgIds': ['e2e-org-ayto', 'e2e-org-pena-cerrada'],
          'visibility': 'public',
          'visibilityOrgId': 'absent',
          'startDate': { 'prefix': '${output.startDay}' },
          'endDate': { 'prefix': '${output.startDay}' },
          'location.displayName': 'present',
          'location.coordinates': 'present',
          'signupEnabled': true,
          'maxAttendees': 25,
          'minBirthYear': 1950,
          'maxBirthYear': 2015,
          'telephoneRequired': true,
          'requiresPayment': true,
          'signupGroupSize': 3,
          'attendeesVisibility': 'organizers',
          'signupFields': { 'length': 2 },
          'signupFields.0.label': 'Talla',
          'signupFields.0.type': 'text',
          'signupFields.0.required': true,
          'signupFields.1.label': 'Menu',
          'signupFields.1.type': 'select',
          'signupFields.1.options': ['Carne', 'Pescado']
        }
- runFlow:
    when:
      platform: Android
    commands:
      - runScript:
          file: ../scripts/assertDoc.js
          env:
            DOC_PATH: 'events/${output.eventId}'
            EXPECT_JSON: "{ 'imageURL': { 'prefix': 'http' } }"
      - runScript:
          file: ../scripts/docField.js
          env:
            DOC_PATH: 'events/${output.eventId}'
            FIELD: imageURL
      - evalScript: ${output.firstImage = output.value}

# ── What the organizer sees ──
- openLink: 'cultuvilla://${VILLAGE_SLUG}/evento/_${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-edit-action'
    timeout: 45000
- assertVisible: ${output.title}
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: ${output.startLabel}
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Nacidos entre 1950 y 2015'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Ayuntamiento de Altozano'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Peña Cerrada E2E'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: '.*Usuario E2E.*'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: ${output.description}

# ── A co-organizer may edit it ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${ORGANIZER_EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://${VILLAGE_SLUG}/evento/_${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-edit-action'
    timeout: 45000

# ── A villager who is neither may only read it ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${VILLAGER_EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://${VILLAGE_SLUG}/evento/_${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-share-action'
    timeout: 45000
- assertVisible: ${output.title}
- assertNotVisible:
    id: 'event-edit-action'
# The edit link itself sends a non-organizer back to the event.
- openLink: 'cultuvilla://crear/evento?eventId=${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-share-action'
    timeout: 45000
- assertNotVisible:
    id: 'event-form-primary'

# ── Edit every field ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://crear/evento?eventId=${output.eventId}'
- runFlow: ../subflows/event-edit-all.yaml
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'events/${output.eventId}'
      TIMEOUT_MS: '60000'
      EXPECT_JSON: >-
        {
          'title': '${output.editTitle}',
          'description': '${output.editDescription}',
          'status': 'published',
          'organizerUserIds': ['e2e-admin'],
          'organizerOrgIds': ['e2e-org-pena-cerrada'],
          'visibility': 'organization',
          'visibilityOrgId': 'e2e-org-pena-cerrada',
          'startDate': { 'prefix': '${output.editDay}' },
          'endDate': { 'prefix': '${output.editEndDay}' },
          'location.displayName': 'present',
          'signupEnabled': true,
          'maxAttendees': 30,
          'minBirthYear': 'absent',
          'maxBirthYear': 'absent',
          'telephoneRequired': false,
          'requiresPayment': false,
          'signupGroupSize': 1,
          'attendeesVisibility': 'members',
          'signupFields': { 'length': 2 },
          'signupFields.0.label': 'Talla de camiseta',
          'signupFields.0.type': 'text',
          'signupFields.1.label': 'Alergias',
          'signupFields.1.type': 'checkbox'
        }
- runFlow:
    when:
      platform: Android
    commands:
      - runScript:
          file: ../scripts/assertDoc.js
          env:
            DOC_PATH: 'events/${output.eventId}'
            EXPECT_JSON: "{ 'imageURL': { 'not': '${output.firstImage}' } }"

# ── What the organizer sees now ──
- openLink: 'cultuvilla://${VILLAGE_SLUG}/evento/_${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-edit-action'
    timeout: 45000
- assertVisible: ${output.editTitle}
- assertVisible: 'Este evento es privado.*'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: ${output.editLabel}
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: 'Peña Cerrada E2E'
- assertNotVisible: 'Ayuntamiento de Altozano'
- assertNotVisible: 'Nacidos entre.*'
- runFlow:
    file: ../subflows/see-text.yaml
    env:
      TEXT: ${output.editDescription}

# ── Private now: the villager can't open it ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${VILLAGER_EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://${VILLAGE_SLUG}/evento/_${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'entity-not-found'
    timeout: 45000
- assertNotVisible: ${output.editTitle}

# ── Cancel ──
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${ADMIN_EMAIL}
      PASSWORD: ${PASSWORD}
- openLink: 'cultuvilla://crear/evento?eventId=${output.eventId}'
- extendedWaitUntil:
    visible:
      id: 'event-delete'
    timeout: 45000
- tapOn:
    id: 'event-delete'
- runFlow:
    file: ../subflows/confirm-alert.yaml
    env:
      BUTTON: 'Eliminar'
- runScript:
    file: ../scripts/assertDoc.js
    env:
      DOC_PATH: 'events/${output.eventId}'
      EXPECT_JSON: "{ 'status': 'cancelled', 'title': '${output.editTitle}' }"
