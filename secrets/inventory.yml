# Names only, never values. This repo is public: names, stores and renewal paths
# only, nothing about accounts or people beyond that.
#
# Functions read their secrets from Secret Manager at runtime (`defineSecret`), so
# those entries take no `env`; every env must hold each one (infra/env-parity.json
# compares the secret names of the three projects as sets).
#
# In apps/mobile/.env, the Firebase web config and OAuth client ids are public by
# design, and DEV_LOGIN_PASSWORD is the seeded demo accounts' password, committed in
# scripts/data/seed-fixtures: none of them is a secret.
adc: ~/.config/cultuvilla/adc.json
secrets:
  # Expo robot token for EAS builds, submits and OTA updates. platform:, not gsm:,
  # because a secret in only one project's Secret Manager would trip the env-parity
  # gate, and the token is minted at expo.dev and lives in GitHub either way. The
  # local copy in apps/mobile/.env is pasted by hand.
  - name: EXPO_TOKEN
    store: platform:GitHub Actions
    consumers: [GitHub Actions EAS workflows, local eas-cli in apps/mobile]
    expires: never
    renew: expo.dev, the Cultuvilla account, Settings, Access tokens, Robot users, Create token; paste it into GitHub (Settings, Secrets and variables, Actions, EXPO_TOKEN) and into apps/mobile/.env, then revoke the old one
    owner: alvaro

  - name: APNS_AUTH_KEY
    store: gsm:villa-events
    consumers: [functions (push)]
    expires: never
    renew: developer.apple.com, Keys, +, Apple Push Notifications service (Sandbox & Production, Team Scoped); add {keyId, privateKey} as one JSON with gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with; verify an iOS push arrives; only then revoke the old key in developer.apple.com, Keys; docs/plans/ongoing/device-notifications.md
    owner: alvaro

  - name: APNS_AUTH_KEY
    store: gsm:cultuvilla-beta
    consumers: [functions (push)]
    expires: never
    renew: developer.apple.com, Keys, +, Apple Push Notifications service (Sandbox & Production, Team Scoped); add {keyId, privateKey} as one JSON with gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with; verify an iOS push arrives; only then revoke the old key in developer.apple.com, Keys; docs/plans/ongoing/device-notifications.md
    owner: alvaro

  - name: APNS_AUTH_KEY
    store: gsm:cultuvilla-prod
    consumers: [functions (push)]
    expires: never
    renew: developer.apple.com, Keys, +, Apple Push Notifications service (Sandbox & Production, Team Scoped); add {keyId, privateKey} as one JSON with gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with; verify an iOS push arrives; only then revoke the old key in developer.apple.com, Keys; docs/plans/ongoing/device-notifications.md
    owner: alvaro


  - name: GOOGLE_MAPS_API_KEY
    store: gsm:villa-events
    consumers: [functions (maps proxy)]
    expires: never
    renew: console.cloud.google.com, APIs & Services, Credentials, Create API key restricted to Maps Static and Geocoding; gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with; verify a pueblo map loads; only then delete the old key in Credentials; docs/decisions/pueblo-location-map.md
    owner: alvaro

