  - name: OBSERVABILITY_USER_ID_SALT
    store: gsm:villa-events
    consumers: [functions]
    expires: never
    renew: rotate only in an incident (breaks the join between old and new user hashes); random bytes generated locally into gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with, all of them in one deploy so no two functions hash with different salts; verify the logs show the new hashes; only then disable the old version
    owner: alvaro

  - name: OBSERVABILITY_USER_ID_SALT
    store: gsm:cultuvilla-beta
    consumers: [functions]
    expires: never
    renew: rotate only in an incident (breaks the join between old and new user hashes); random bytes generated locally into gcloud secrets versions add; then redeploy every function that binds it in that env (firebase deploy --only functions --project <env>, or that env's deploy workflow), since deployed functions keep the version they were deployed with, all of them in one deploy so no two functions hash with different salts; verify the logs show the new hashes; only then disable the old version
    owner: alvaro

