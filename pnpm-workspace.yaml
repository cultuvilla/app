packages:
  - apps/*
  - packages/*

# Security floors for transitive dependencies (GitHub Dependabot alerts).
# Each entry lifts a vulnerable version to the first patched release of the
# SAME major line, so no dependent sees an API change. Drop an entry once
# every package that pulls it in requires the patched version itself.
overrides:
  '@babel/core@>=7 <7.29.6': ^7.29.6
  '@fastify/busboy@>=3 <3.2.2': ^3.2.2
  '@grpc/grpc-js@>=1.10 <1.14.5': ^1.14.5
  '@grpc/grpc-js@>=1.9 <1.9.16': ~1.9.16
  '@hono/node-server@>=1 <1.19.18': ^1.19.18
  '@modelcontextprotocol/sdk@>=1 <1.32.0': ^1.32.0
  '@protobufjs/utf8@<1.1.1': ^1.1.1
  '@xmldom/xmldom@>=0.8 <0.8.15': ~0.8.15
  '@xmldom/xmldom@>=0.9 <0.9.12': ~0.9.12
  baseline-browser-mapping@>=2 <2.11.0: ^2.11.0
  body-parser@>=1 <1.20.9: ~1.20.9
  body-parser@>=2 <2.4.0: ^2.4.0
  brace-expansion@>=1 <1.1.21: ~1.1.21
